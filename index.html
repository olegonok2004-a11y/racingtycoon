let currentCase = null;

function openCase(cs){
  SFX.resume();
  if (state.apples < cs.price) {
    showToast(`Не хватает ${cs.price - state.apples} 🍎`, 'error', 1800);
    SFX.sfx.deny(); return;
  }
  state.apples -= cs.price;
  state.casesOpened++;
  save(); renderCases();
  currentCase = cs;
  const droppedSkin = rollFromCase(cs);
  caseResult.classList.remove('show');
  rouletteTrack.style.transition = 'none';
  rouletteTrack.style.transform = 'translateX(0)';
  caseOpenOverlay.classList.add('show');
  caseOpenTitle.textContent = cs.name;
  caseOpenSub.textContent = cs.sub;
  const rouletteItems = [];
  const TOTAL_ITEMS = 60, WINNER_INDEX = 52;
  for (let i = 0; i < TOTAL_ITEMS; i++){
    let skin;
    if (i === WINNER_INDEX) skin = droppedSkin;
    else { const randId = cs.pool[Math.floor(Math.random() * cs.pool.length)]; skin = getSkin(randId); }
    rouletteItems.push(skin);
  }
  rouletteTrack.innerHTML = '';
  rouletteItems.forEach(skin => {
    const item = document.createElement('div');
    item.className = 'roulette-item ' + skin.rarity;
    const bg = skin.gemGradient
      ? `linear-gradient(135deg, ${skin.colors[0]}, ${skin.colors[1]}, ${skin.colors[0]})`
      : `linear-gradient(135deg, ${skin.colors[0]}, ${skin.colors[1]})`;
    item.innerHTML = `<div class="roulette-item-icon" style="background:${bg}">${skin.icon}</div><div class="roulette-item-name">${skin.name}</div>`;
    rouletteTrack.appendChild(item);
  });
  SFX.sfx.caseSpin();
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const itemWidth = 110;
      const containerWidth = document.getElementById('rouletteWrap').offsetWidth;
      const winnerCenter = WINNER_INDEX * itemWidth + itemWidth / 2 + 20;
      const targetX = containerWidth / 2 - winnerCenter;
      const jitter = (Math.random() - 0.5) * 40;
      rouletteTrack.style.transition = 'transform 5s cubic-bezier(.15, .6, .2, 1)';
      rouletteTrack.style.transform = `translateX(${targetX + jitter}px)`;
      setTimeout(() => revealResult(droppedSkin), 5100);
    });
  });
}

function rollFromCase(cs){
  const items = cs.pool.map(id => { const skin = getSkin(id); return { skin, weight: RARITIES[skin.rarity].weight }; });
  const totalWeight = items.reduce((sum, it) => sum + it.weight, 0);
  let roll = Math.random() * totalWeight;
  for (const it of items) { roll -= it.weight; if (roll <= 0) return it.skin; }
  return items[items.length - 1].skin;
}

function revealResult(skin){
  const isNew = !state.owned.includes(skin.id);
  if (isNew) { state.owned.push(skin.id); save(); }
  renderCollection(); renderProfile();
  const bg = skin.gemGradient
    ? `linear-gradient(135deg, ${skin.colors[0]}, ${skin.colors[1]}, ${skin.colors[0]})`
    : `linear-gradient(135deg, ${skin.colors[0]}, ${skin.colors[1]})`;
  caseResultIcon.style.background = bg;
  caseResultIcon.textContent = skin.icon;
  caseResultName.textContent = skin.name + (isNew ? ' ✨' : ' (повтор)');
  caseResultRarity.textContent = RARITIES[skin.rarity].name;
  caseResultRarity.className = 'case-result-rarity ' + skin.rarity;
  caseResult.classList.add('show');
  SFX.sfx.caseReveal(skin.rarity);
  TelegramApp.hapticNotify(skin.rarity === 'legendary' || skin.rarity === 'epic' ? 'success' : 'warning');
  if (skin.rarity === 'epic' || skin.rarity === 'legendary') spawnConfetti(skin.rarity === 'legendary' ? 80 : 40);
  if (isNew) showToast(`✨ Новый скин: ${skin.name}!`, 'success', 2500);
  else showToast(`Повтор: ${skin.name}`, 'info', 1800);
}

function spawnConfetti(count){

function isCellFreeForBuff(x, y){
  if (snake.some(s => s.x === x && s.y === y)) return false;
  if (food && food.x === x && food.y === y) return false;
  if (extraFoods.some(f => f.x === x && f.y === y)) return false;
  if (buffPickup && buffPickup.x === x && buffPickup.y === y) return false;
  if (demonSnake && demonSnake.some(s => s.x === x && s.y === y)) return false;
  if (obstacles.some(o => o.x === x && o.y === y)) return false;
  return true;
}

function spawnFood(){
  const mode = MODES[selectedMode];
  const free = [];
  for (let y=0; y<ROWS; y++)
    for (let x=0; x<COLS; x++)
      if (isCellFreeForBuff(x, y)) free.push({x,y});
  if (free.length === 0) return;
  const pos = free[Math.floor(Math.random()*free.length)];
  const newFood = { x: pos.x, y: pos.y, type: Math.floor(Math.random()*6), spawnT: 0 };
  if (mode.endlessFood && food) {
    extraFoods.push(newFood);
  } else {
    food = newFood;
  }
}

function spawnExtraFood(){
  const maxFoods = 5;
  const totalFoods = 1 + extraFoods.length;
  if (totalFoods >= maxFoods) return;
  const free = [];
  for (let y=0; y<ROWS; y++)
    for (let x=0; x<COLS; x++)
      if (isCellFreeForBuff(x, y)) free.push({x,y});
  if (free.length === 0) return;
  const pos = free[Math.floor(Math.random()*free.length)];
  extraFoods.push({ x: pos.x, y: pos.y, type: Math.floor(Math.random()*6), spawnT: 0 });
}

function spawnBuff(){
  const mode = MODES[selectedMode];
  if (!mode.buffsEnabled) return;
  const free = [];
  for (let y = 0; y < ROWS; y++){
    for (let x = 0; x < COLS; x++){
      if (isCellFreeForBuff(x, y)) free.push({ x, y });
    }
  }
  if (free.length === 0) return;
  const pos = free[Math.floor(Math.random() * free.length)];
  const type = pickRandomBuffType();
  buffPickup = { x: pos.x, y: pos.y, type, spawnT: 0, life: 12 };
}

function spawnObstacles(){
  const count = 6 + Math.floor(Math.random() * 4);
  for (let i = 0; i < count; i++){
    const free = [];
    for (let y = 0; y < ROWS; y++){
      for (let x = 0; x < COLS; x++){
        if (x < 5 && y === 10) continue;
        if (isCellFreeForBuff(x, y)) free.push({ x, y });
      }
    }
    if (free.length === 0) break;
    const pos = free[Math.floor(Math.random() * free.length)];
    obstacles.push({ x: pos.x, y: pos.y, type: Math.random() < 0.5 ? 'rock' : 'spike' });
  }
}

function spawnDemonSnake(){
  const startX = 16, startY = 3;
  demonSnake = [
    { x: startX, y: startY },
    { x: startX + 1, y: startY },
    { x: startX + 2, y: startY },
    { x: startX + 3, y: startY },
  ];
  demonMoveTimer = 0;
  SFX.sfx.demonRoar();
  showToast('💀 Демоническая змея появилась!', 'error', 3000);
}

function updateDemonSnake(dt){
  if (!demonSnake || demonSnake.length === 0) return;
  const mode = MODES[selectedMode];
  demonMoveTimer += dt;
  const moveEvery = 0.28;
  if (demonMoveTimer < moveEvery) return;
  demonMoveTimer -= moveEvery;

  const head = demonSnake[0];
  const playerHead = snake[0];

  const dirs = [
    { x: 1, y: 0 }, { x: -1, y: 0 },
    { x: 0, y: 1 }, { x: 0, y: -1 },
  ];

  const scored = dirs.map(d => {
    const nx = head.x + d.x;
    const ny = head.y + d.y;
    if (mode.walls) {
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return { d, score: -999 };
    }
    if (demonSnake.some((s, i) => i > 0 && s.x === nx && s.y === ny)) return { d, score: -900 };
    if (obstacles.some(o => o.x === nx && o.y === ny)) return { d, score: -800 };
    if (snake.some(s => s.x === nx && s.y === ny)) return { d, score: -700 };
    const dist = Math.abs(nx - playerHead.x) + Math.abs(ny - playerHead.y);
    return { d, score: 100 - dist };
  });

  scored.sort((a, b) => b.score - a.score);
  const best = scored[0];
  if (!best || best.score <= -500) return;

  const newHead = { x: head.x + best.d.x, y: head.y + best.d.y };
  demonSnake.unshift(newHead);
  demonSnake.pop();
}

function checkDemonCollision(){
  if (!demonSnake) return false;
  const head = snake[0];
  return demonSnake.some(s => s.x === head.x && s.y === head.y);
}

const FRUITS = [
  { emoji:'🍎', color:'#ff5e7a' },
  { emoji:'🍌', color:'#ffd76e' },
  { emoji:'🍇', color:'#b07de0' },
  { emoji:'🍓', color:'#ff7a8a' },
  { emoji:'🍊', color:'#ffa95c' },
  { emoji:'🍒', color:'#e8556b' },
];

function step(){
  const mode = MODES[selectedMode];
  dir = nextDir;
  let head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (mode.walls) {
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return die();
  } else {
    if (head.x < 0) head.x = COLS - 1;
    if (head.x >= COLS) head.x = 0;
    if (head.y < 0) head.y = ROWS - 1;
    if (head.y >= ROWS) head.y = 0;
  }

  if (obstacles.some(o => o.x === head.x && o.y === head.y)) return die();

  const ghostOn = isBuffActive('ghost');
  if (!ghostOn) {
    for (let i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return die();
    }
  }

  if (demonSnake && demonSnake.some(s => s.x === head.x && s.y === head.y)) return die();

  snake.unshift(head);

  const skin = getSkin(state.active);
  if (skin.particles) {
    trailSpots.push({ x: head.x, y: head.y, life: 1, color: skin.colors[0] });
    if (trailSpots.length > 40) trailSpots.shift();
  }

  let ate = false;

  if (food && head.x === food.x && head.y === food.y) {
    onFruitEaten();
    score += combo.value;
    addApples(mode.appleMultiplier);
    if (score > state.bestScore) state.bestScore = score;
    if (score > (state.bestByMode[selectedMode] || 0)) state.bestByMode[selectedMode] = score;
    save();
    SFX.sfx.eat();
    TelegramApp.hapticImpact('light');
    foodEatenPulse = 1;
    spawnBurst(head.x*CELL + CELL/2, head.y*CELL + CELL/2, FRUITS[food.type].color, 16);
    spawnHearts(head.x*CELL + CELL/2, head.y*CELL + CELL/2, 2);
    food = null;
    spawnFood();
    if (mode.endlessFood && extraFoods.length < 4) spawnExtraFood();
    ate = true;
  }

  for (let i = extraFoods.length - 1; i >= 0; i--) {
    const ef = extraFoods[i];
    if (head.x === ef.x && head.y === ef.y) {
      onFruitEaten();
      score += combo.value;
      addApples(mode.appleMultiplier);
      if (score > state.bestScore) state.bestScore = score;
      if (score > (state.bestByMode[selectedMode] || 0)) state.bestByMode[selectedMode] = score;
      save();
      SFX.sfx.eat();
      TelegramApp.hapticImpact('light');
      foodEatenPulse = 1;
      spawnBurst(ef.x*CELL + CELL/2, ef.y*CELL + CELL/2, FRUITS[ef.type].color, 12);
      extraFoods.splice(i, 1);
      if (mode.endlessFood) spawnExtraFood();
      ate = true;
    }
  }

  if (buffPickup && head.x === buffPickup.x && head.y === buffPickup.y) {
    activateBuff(buffPickup.type);
    buffPickup = null;
    ate = true;
  }

  if (ate) { updateHUD(); renderCases(); }
  else snake.pop();

  applyMagnet();

  if (checkDemonCollision()) return die();
}

function addApples(multiplier){
  if (multiplier === 1/3) {
    fractionalApples += 1/3;
    const whole = Math.floor(fractionalApples);
    fractionalApples -= whole;
    state.apples += whole;
    state.totalApples += whole;
  } else {
    const amount = Math.round(multiplier);
    state.apples += amount;
    state.totalApples += amount;
  }
}

function applyMagnet(){
  if (!isBuffActive('magnet')) return;
  const head = snake[0];
  const allFruits = [];
  if (food) allFruits.push(food);
  extraFoods.forEach(f => allFruits.push(f));

  const moves = [];
  allFruits.forEach(f => {
    const dx = head.x - f.x;
    const dy = head.y - f.y;
    if (dx === 0 && dy === 0) return;
    let nx = f.x, ny = f.y;
    if (Math.abs(dx) >= Math.abs(dy)) nx = f.x + Math.sign(dx);
    else ny = f.y + Math.sign(dy);
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;
    const inBody = snake.slice(1).some(s => s.x === nx && s.y === ny);
    if (inBody) return;
    if (obstacles.some(o => o.x === nx && o.y === ny)) return;
    moves.push({ fruit: f, nx, ny });
  });

  const taken = new Set();
  moves.forEach(m => {
    const key = m.nx + ',' + m.ny;
    if (taken.has(key)) return;
    const occupied = allFruits.some(other => other !== m.fruit && other.x === m.nx && other.y === m.ny && !moves.some(mm => mm.fruit === other && mm.nx === other.x && mm.ny === other.y));
    if (occupied) return;
    taken.add(key);
    m.fruit.x = m.nx;
    m.fruit.y = m.ny;
  });
}

function die(){
  const mode = MODES[selectedMode];
  running = false; timerRunning = false; gameOver = true;
  shake = 12;
  state.gamesPlayed++;
  save();
  SFX.sfx.die();
  TelegramApp.hapticNotify('error');
  const skin = getSkin(state.active);
  spawnBurst(snake[0].x*CELL + CELL/2, snake[0].y*CELL + CELL/2, skin.colors[0], 34);
  const best = state.bestByMode[selectedMode] || 0;
  const isRecord = score > 0 && score >= best;
  const timeElapsed = mode.timeLimit > 0 ? (mode.timeLimit - timeRemaining) : time;
  const gainedApples = mode.appleMultiplier === 1/3
    ? Math.floor(score / 3)
    : Math.round(score * mode.appleMultiplier);
  ovTitle.textContent = isRecord ? '🏆 Новый рекорд!' : 'Игра окончена';
  ovText.innerHTML = `
    Режим: <b style="color:${mode.colorA}">${mode.name}</b><br>
    Счёт: <span class="big-stat">${score}</span><br>
    Время: ${timeElapsed.toFixed(1)} сек<br>
    Рекорд режима: ${Math.max(best, score)}<br>
    <span style="color:#e0a47a;font-size:13px;margin-top:8px;display:inline-block">

  ovBtn.textContent = 'Ещё раз';

  if (dpad) dpad.classList.add('hidden');
  updateHUD();

  renderModes();
  resetCombo();
}

function winGame(){

/* ============================================================
   ЧАСТИЦЫ
============================================================ */
function spawnBurst(x, y, color, count){
  for (let i = 0; i < count; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 0.8 + Math.random() * 3.5;
    particles.push({ type:'dot', x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1, maxLife: .6 + Math.random()*.6, size: 2 + Math.random()*3.5, color });
  }
}
function spawnHearts(x, y, count){
  for (let i = 0; i < count; i++){
    particles.push({ type:'heart', x: x + (Math.random()-0.5)*20, y: y + (Math.random()-0.5)*20, vx: (Math.random()-0.5)*0.8, vy: -1 - Math.random()*1.2, life: 1, maxLife: 1.1, size: 8 + Math.random()*4, color: ['#ff8ba7','#ff6b8a','#ffb6e0'][Math.floor(Math.random()*3)] });
  }
}
function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx * dt * 60; p.y += p.vy * dt * 60;
    if (p.type === 'dot') { p.vx *= 0.93; p.vy *= 0.93; p.vy += 0.1 * dt * 60; }
    else { p.vy *= 0.98; }
    p.life -= dt / p.maxLife;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = trailSpots.length - 1; i >= 0; i--){
    trailSpots[i].life -= dt * 0.7;
    if (trailSpots[i].life <= 0) trailSpots.splice(i, 1);
  }
}

/* ============================================================
   ЦВЕТ
============================================================ */
function hexToRgb(hex){ const n = parseInt(hex.replace('#',''), 16); return { r: (n>>16)&255, g: (n>>8)&255, b: n&255 }; }
function rgbToHex(r, g, b){ return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function shade(hex, factor){ const { r, g, b } = hexToRgb(hex); return rgbToHex(r*factor, g*factor, b*factor); }
function rgba(hex, a){ const { r, g, b } = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }

   ОТРИСОВКА
============================================================ */
function drawGrid(){
  const mode = MODES[selectedMode];
  const bgGrad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 40, canvas.width/2, canvas.height/2, canvas.width * 0.75);
  if (mode.id === 'hardcore') {
    bgGrad.addColorStop(0, '#2a1a1e');
    bgGrad.addColorStop(0.7, '#1f1418');
    bgGrad.addColorStop(1, '#150b0e');
  } else if (mode.id === 'endless') {
    bgGrad.addColorStop(0, '#1e2544');
    bgGrad.addColorStop(0.7, '#181d33');
    bgGrad.addColorStop(1, '#0f1220');
  } else {
    bgGrad.addColorStop(0, '#262732');
    bgGrad.addColorStop(0.7, '#1e1f28');
    bgGrad.addColorStop(1, '#17181f');
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let y = 0; y < ROWS; y++){
    for (let x = 0; x < COLS; x++){
      if ((x + y) % 2 === 0){
        ctx.fillStyle = 'rgba(255,255,255,0.016)';
        ctx.fillRect(x*CELL, y*CELL, CELL, CELL);
      }
    }
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.028)'; ctx.lineWidth = 1;
  for (let i = 1; i < COLS; i++){
    ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(canvas.width, i*CELL); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, canvas.width-4, canvas.height-4);
  ctx.strokeStyle = mode.walls ? 'rgba(255,255,255,0.07)' : 'rgba(124,138,255,0.2)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(3.5, 3.5, canvas.width-7, canvas.height-7);

  if (isBuffActive('magnet')) {
    const t = activeBuffs.magnet.timeLeft;
    ctx.fillStyle = `rgba(255,139,167,${0.05 * (t / activeBuffs.magnet.total)})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const head = snake[0];
    const headX = head.x * CELL + CELL/2;
    const headY = head.y * CELL + CELL/2;
    const allFruits = [];
    if (food) allFruits.push(food);
    extraFoods.forEach(f => allFruits.push(f));
    ctx.strokeStyle = 'rgba(255,139,167,0.25)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    allFruits.forEach(f => {
      const fx = f.x * CELL + CELL/2;
      const fy = f.y * CELL + CELL/2;
      ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(headX, headY); ctx.stroke();
    });
    ctx.setLineDash([]);
  }
}

function drawFruitAt(fruit, isExtra){
  if (!fruit) return;
  foodPulse += 0.08;
  fruit.spawnT = Math.min(1, (fruit.spawnT || 0) + 0.05);
  const spawnScale = 1 - Math.pow(1 - fruit.spawnT, 3);
  const pulse = 1 + Math.sin(foodPulse) * 0.12;
  const cx = fruit.x * CELL + CELL/2;
  const cy = fruit.y * CELL + CELL/2;
  const r = CELL * 0.36 * pulse * spawnScale * (isExtra ? 0.85 : 1);
  const fr = FRUITS[fruit.type];
  if (r < 0.5) return;

  const glow1 = ctx.createRadialGradient(cx, cy, r*0.5, cx, cy, r*2.4);
  glow1.addColorStop(0, rgba(fr.color, 0.32));
  glow1.addColorStop(0.5, rgba(fr.color, 0.1));
  glow1.addColorStop(1, rgba(fr.color, 0));
  ctx.fillStyle = glow1;
  ctx.beginPath(); ctx.arc(cx, cy, r*2.4, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(cx, cy + r*0.75, r*0.9, r*0.35, 0, 0, Math.PI*2); ctx.fill();

  const bodyGrad = ctx.createRadialGradient(cx - r*0.3, cy - r*0.35, r*0.1, cx, cy, r);
  bodyGrad.addColorStop(0, shade(fr.color, 1.35));
  bodyGrad.addColorStop(0.6, fr.color);
  bodyGrad.addColorStop(1, shade(fr.color, 0.75));
  ctx.fillStyle = bodyGrad;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = rgba(shade(fr.color, 0.5), 0.6);
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.42)';
  ctx.beginPath(); ctx.ellipse(cx - r*0.3, cy - r*0.4, r*0.35, r*0.22, -0.5, 0, Math.PI*2); ctx.fill();

  ctx.font = `${Math.floor(CELL*(isExtra ? 0.55 : 0.66))}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(fr.emoji, cx, cy + 1.5);
}

function drawFood(){ drawFruitAt(food, false); }
function drawExtraFoods(){ extraFoods.forEach(f => drawFruitAt(f, true)); }

function drawDemonSnake(){
  if (!demonSnake) return;
  demonSnake.forEach((seg, i) => {
    const px = seg.x * CELL, py = seg.y * CELL;
    const pad = 2, size = CELL - pad*2;
    const cx = px + CELL/2, cy = py + CELL/2;
    const isHead = i === 0;
    const t = gameTime;

    if (isHead) {
      const aura = ctx.createRadialGradient(cx, cy, 4, cx, cy, CELL * 1.2);
      aura.addColorStop(0, 'rgba(180,20,40,0.5)');
      aura.addColorStop(1, 'rgba(180,20,40,0)');
      ctx.fillStyle = aura;
      ctx.beginPath(); ctx.arc(cx, cy, CELL * 1.2, 0, Math.PI*2); ctx.fill();
    }

    const grad = ctx.createLinearGradient(px, py, px + CELL, py + CELL);
    grad.addColorStop(0, '#5a0a18');
    grad.addColorStop(1, '#2a0208');
    ctx.fillStyle = grad;

    if (isHead) {
      const radius = 9;
      roundRect(ctx, px + pad, py + pad, size, size, radius);
      ctx.fill();
      ctx.fillStyle = '#8a1020';
      ctx.beginPath();
      ctx.moveTo(cx - 7, cy - size/2 + 2);
      ctx.lineTo(cx - 10, cy - size/2 - 8);
      ctx.lineTo(cx - 4, cy - size/2 - 2);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx + 7, cy - size/2 + 2);
      ctx.lineTo(cx + 10, cy - size/2 - 8);
      ctx.lineTo(cx + 4, cy - size/2 - 2);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ff2040';
      ctx.shadowColor = '#ff2040';
      ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(cx - 4, cy - 2, 2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 4, cy - 2, 2, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(cx - 4, cy - 2, 0.9, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 4, cy - 2, 0.9, 0, Math.PI*2); ctx.fill();
    } else {
      roundRect(ctx, px + pad, py + pad, size, size, 6);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,20,40,0.3)';
      ctx.lineWidth = 1;
      roundRect(ctx, px + pad, py + pad, size, size, 6);
      ctx.stroke();
    }

    const pulse = 0.5 + 0.5 * Math.sin(t*4 + i*0.5);
    ctx.fillStyle = `rgba(255,40,60,${0.15 * pulse})`;
    roundRect(ctx, px + pad, py + pad, size, size, isHead ? 9 : 6);
    ctx.fill();
  });
}

function drawObstacles(){
  obstacles.forEach(o => {
    const cx = o.x * CELL + CELL/2;
    const cy = o.y * CELL + CELL/2;
    if (o.type === 'rock') {
      const r = CELL * 0.42;
      const grad = ctx.createRadialGradient(cx - r*0.3, cy - r*0.3, r*0.1, cx, cy, r);
      grad.addColorStop(0, '#6a6a72');
      grad.addColorStop(0.7, '#3a3a42');
      grad.addColorStop(1, '#25252a');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath(); ctx.arc(cx - r*0.3, cy - r*0.35, r*0.2, 0, Math.PI*2); ctx.fill();
    } else {
      const r = CELL * 0.4;
      ctx.fillStyle = '#8a2030';
      ctx.beginPath();
      for (let i = 0; i < 8; i++){
        const a = (i / 8) * Math.PI * 2;
        const rr = i % 2 === 0 ? r : r * 0.6;
        const px = cx + Math.cos(a) * rr;
        const py = cy + Math.sin(a) * rr;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,80,90,0.3)';
      ctx.beginPath(); ctx.arc(cx, cy, r*0.3, 0, Math.PI*2); ctx.fill();
    }
  });
}

function drawBuffPickup(){
  if (!buffPickup) return;
  const cfg = BUFFS[buffPickup.type];
  const cx = buffPickup.x * CELL + CELL/2;
  const cy = buffPickup.y * CELL + CELL/2;
  const t = gameTime;
  const float = Math.sin(t * 3) * 2;
  const scale = 1 + Math.sin(t * 5) * 0.08;
  const r = CELL * 0.42 * scale;

  const glow = ctx.createRadialGradient(cx, cy + float, r*0.5, cx, cy + float, r*2.2);
  glow.addColorStop(0, rgba(cfg.colorA, 0.6));
  glow.addColorStop(0.5, rgba(cfg.colorA, 0.15));
  glow.addColorStop(1, rgba(cfg.colorA, 0));
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx, cy + float, r*2.2, 0, Math.PI*2); ctx.fill();

  ctx.save();
  ctx.translate(cx, cy + float);
  ctx.rotate(t * 1.5);
  ctx.strokeStyle = rgba(cfg.colorA, 0.5);
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 4; i++){
    const a = (i / 4) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 1.3, Math.sin(a) * r * 1.3);
    ctx.lineTo(Math.cos(a) * r * 1.7, Math.sin(a) * r * 1.7);
    ctx.stroke();
  }
  ctx.restore();

  const grad = ctx.createRadialGradient(cx - r*0.3, cy + float - r*0.3, r*0.1, cx, cy + float, r);
  grad.addColorStop(0, shade(cfg.colorA, 1.3));
  grad.addColorStop(0.6, cfg.colorA);
  grad.addColorStop(1, cfg.colorB);
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(cx, cy + float, r, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy + float, r, 0, Math.PI*2); ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.ellipse(cx - r*0.3, cy + float - r*0.4, r*0.35, r*0.2, -0.5, 0, Math.PI*2); ctx.fill();

  ctx.font = `${Math.floor(CELL * 0.6)}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(cfg.icon, cx, cy + float + 1);

  if (buffPickup.life < 4){
    ctx.fillStyle = `rgba(255,255,255,${Math.sin(t*10) * 0.3 + 0.7})`;
    ctx.font = '10px system-ui';
    ctx.fillText(Math.ceil(buffPickup.life) + 'с', cx, cy + float + r + 10);
  }
}

function drawTrail(){
  trailSpots.forEach(spot => {
    const cx = spot.x * CELL + CELL/2;
    const cy = spot.y * CELL + CELL/2;
    ctx.globalAlpha = spot.life * 0.35;
    ctx.fillStyle = spot.color;
    ctx.beginPath(); ctx.arc(cx, cy, CELL * 0.3 * spot.life, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawFace(skin, cx, cy, dir, t, index){
  const faceType = skin.face || 'happy';
  let ex1, ey1, ex2, ey2;
  const eyeDist = 3.6, eyeSide = 4.5;
  if (dir.x === 1)       { ex1 = cx + eyeSide; ey1 = cy - eyeDist; ex2 = cx + eyeSide; ey2 = cy + eyeDist; }
  else if (dir.x === -1) { ex1 = cx - eyeSide; ey1 = cy - eyeDist; ex2 = cx - eyeSide; ey2 = cy + eyeDist; }
  else if (dir.y === 1)  { ex1 = cx - eyeDist; ey1 = cy + eyeSide; ex2 = cx + eyeDist; ey2 = cy + eyeSide; }
  else                   { ex1 = cx - eyeDist; ey1 = cy - eyeSide; ex2 = cx + eyeDist; ey2 = cy - eyeSide; }

  if (faceType === 'panda'){
    ctx.fillStyle = skin.accent;
    ctx.beginPath(); ctx.arc(ex1, ey1, 4.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex2, ey2, 4.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex1, ey1, 2.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex2, ey2, 2.6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#111';
    const px = dir.x * 0.9, py = dir.y * 0.9;
    ctx.beginPath(); ctx.arc(ex1 + px, ey1 + py, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex2 + px, ey2 + py, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = skin.accent;
    ctx.beginPath(); ctx.arc(cx + dir.x * 6, cy + dir.y * 6, 1.8, 0, Math.PI*2); ctx.fill();
    return;
  }
  if (faceType === 'dragon'){
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex1, ey1, 2.8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex2, ey2, 2.8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    const px = dir.x * 0.6, py = dir.y * 0.6;
    ctx.beginPath(); ctx.ellipse(ex1 + px, ey1 + py, 0.9, 1.9, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(ex2 + px, ey2 + py, 0.9, 1.9, 0, 0, Math.PI*2); ctx.fill();
    return;
  }
  const blink = Math.sin(t * 2.5 + index * 0.7) > 0.94;
  if (faceType === 'wink'){
    ctx.strokeStyle = '#1c1d22'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(ex1, ey1, 2.2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    if (!blink){ ctx.fillStyle = '#1c1d22'; ctx.beginPath(); ctx.arc(ex2, ey2, 2.2, 0, Math.PI*2); ctx.fill(); }
  } else {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex1, ey1, 2.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex2, ey2, 2.6, 0, Math.PI*2); ctx.fill();
    if (!blink){
      ctx.fillStyle = '#1c1d22';
      const px = dir.x * 0.9, py = dir.y * 0.9;
      ctx.beginPath(); ctx.arc(ex1 + px, ey1 + py, 1.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex2 + px, ey2 + py, 1.5, 0, Math.PI*2); ctx.fill();
    }
  }
  if (skin.blush){
    ctx.fillStyle = 'rgba(255,120,150,0.4)';
    const bd = eyeSide + 2.5;
    let bx1, by1, bx2, by2;
    if (dir.x === 1)       { bx1 = cx + bd; by1 = cy - eyeDist - 1; bx2 = cx + bd; by2 = cy + eyeDist + 1; }
    else if (dir.x === -1) { bx1 = cx - bd; by1 = cy - eyeDist - 1; bx2 = cx - bd; by2 = cy + eyeDist + 1; }
    else if (dir.y === 1)  { bx1 = cx - eyeDist - 1; by1 = cy + bd; bx2 = cx + eyeDist + 1; by2 = cy + bd; }
    else                   { bx1 = cx - eyeDist - 1; by1 = cy - bd; bx2 = cx + eyeDist + 1; by2 = cy - bd; }
    ctx.beginPath(); ctx.arc(bx1, by1, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx2, by2, 2.5, 0, Math.PI*2); ctx.fill();
  }
  if (!blink){
    ctx.strokeStyle = '#1c1d22'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
    const mx = cx + dir.x * 6.5, my = cy + dir.y * 6.5;
    ctx.beginPath();
    if (dir.x === 1 || dir.x === -1) ctx.arc(mx, my, 2.5, dir.x === 1 ? 0.3 : Math.PI - 0.3, dir.x === 1 ? Math.PI - 0.3 : Math.PI * 2 - 0.3);
    else ctx.arc(mx, my, 2.5, dir.y === 1 ? -0.3 : Math.PI + 0.3, dir.y === 1 ? Math.PI + 0.3 : -0.3);
    ctx.stroke();
  }
}

function drawSegment(skin, x, y, index, total, t){
  const px = x * CELL, py = y * CELL;
  const pad = 2, baseSize = CELL - pad*2;
  const cx = px + CELL/2, cy = py + CELL/2;

  let color1 = skin.colors[0], color2 = skin.colors[1];
  let size = baseSize, offsetX = 0, offsetY = 0, shape = 'rounded', alpha = 1;

  if (skin.id === 'gummy'){
    const wobble = Math.sin(t*3 + index*0.6) * 0.5;
    offsetY = wobble * (dir.x !== 0 ? 1 : 0);
    offsetX = wobble * (dir.y !== 0 ? 1 : 0);
    size = baseSize * (0.94 + Math.sin(t*2.5 + index*0.4) * 0.06);
  } else if (skin.id === 'mint' || skin.id === 'peach'){
    const wobble = Math.sin(t*2.5 + index*0.5) * 1;
    offsetY = wobble * (dir.x !== 0 ? 1 : 0);
    offsetX = wobble * (dir.y !== 0 ? 1 : 0);
  } else if (skin.id === 'bubble'){ shape = 'circle'; size = baseSize * 1.02; }
  else if (['candy','lime','orange','blueberry','watermelon'].includes(skin.id)) { size = baseSize * 0.98; }
  else if (skin.id === 'strawberry'){
    const wave = Math.sin(t*3 + index*0.4) * 0.8;
    offsetY = wave * (dir.x !== 0 ? 1 : 0);
    offsetX = wave * (dir.y !== 0 ? 1 : 0);
  } else if (skin.id === 'unicorn'){
    const hue = (t * 120 + index * 25) % 360;
    color1 = `hsl(${hue}, 85%, 78%)`;
    color2 = `hsl(${(hue + 40) % 360}, 85%, 68%)`;
    size = baseSize * (0.96 + Math.sin(t*3 + index*0.3) * 0.05);
  } else if (['dragon','phoenix'].includes(skin.id)){ size = baseSize * (0.94 + Math.sin(t*2 + index*0.3) * 0.06); }
  else if (skin.gemGradient){
    const w1 = 0.5 + 0.5 * Math.sin(t*1.2 + index * 0.15);
    const w2 = 0.5 + 0.5 * Math.sin(t*1.2 + 1.5 + index * 0.15);
    const r1 = hexToRgb(skin.colors[0]), r2 = hexToRgb(skin.colors[1]), r3 = hexToRgb(skin.accent);
    const mix1 = { r: r1.r*(1-w1) + r3.r*w1, g: r1.g*(1-w1) + r3.g*w1, b: r1.b*(1-w1) + r3.b*w1 };
    const mix2 = { r: r2.r*(1-w2) + r1.r*w2, g: r2.g*(1-w2) + r1.g*w2, b: r2.b*(1-w2) + r1.b*w2 };
    color1 = rgbToHex(mix1.r, mix1.g, mix1.b);
    color2 = rgbToHex(mix2.r, mix2.g, mix2.b);
    size = baseSize * (0.97 + Math.sin(t*2 + index*0.2) * 0.04);
  }

  if (isBuffActive('ghost')) alpha = 0.5 + Math.sin(t * 4) * 0.15;
  ctx.globalAlpha = alpha;

  const drawX = px + pad + offsetX, drawY = py + pad + offsetY;
  const drawCx = cx + offsetX, drawCy = cy + offsetY;

  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  roundRect(ctx, drawX + 1, drawY + 2.5, size, size, index === 0 ? 10 : 7);
  ctx.fill();

  const grad = ctx.createLinearGradient(drawX, drawY, drawX + CELL, drawY + CELL);
  grad.addColorStop(0, color1);
  grad.addColorStop(1, color2);
  ctx.fillStyle = grad;

  const radius = index === 0 ? 10 : 7;
  if (shape === 'circle'){
    ctx.beginPath(); ctx.arc(drawCx, drawCy, size/2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.arc(drawCx - size*0.18, drawCy - size*0.22, size*0.18, 0, Math.PI*2); ctx.fill();
  } else {
    roundRect(ctx, drawX, drawY, size, size, radius); ctx.fill();
    const shadeGrad = ctx.createLinearGradient(drawX, drawY + size*0.4, drawX, drawY + size);
    shadeGrad.addColorStop(0, 'rgba(0,0,0,0)');
    shadeGrad.addColorStop(1, 'rgba(0,0,0,0.22)');
    ctx.fillStyle = shadeGrad;
    roundRect(ctx, drawX, drawY + size*0.4, size, size*0.6, radius); ctx.fill();
    const hlGrad = ctx.createLinearGradient(drawX, drawY, drawX, drawY + size*0.5);
    hlGrad.addColorStop(0, 'rgba(255,255,255,0.28)');
    hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hlGrad;
    roundRect(ctx, drawX + 2, drawY + 2, size - 4, size * 0.5, radius - 2); ctx.fill();
  }

  if (skin.stripes){
    ctx.fillStyle = 'rgba(180,120,40,0.3)';
    for (let i = 0; i < 2; i++){ const sx = drawX + 4 + i * (size - 8) * 0.6; ctx.fillRect(sx, drawY + 4, 1.5, size - 8); }
  }
  if (skin.spiral){
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    const steps = 20, totalAngle = Math.PI * 4, startA = index * 0.4;
    for (let i = 0; i <= steps; i++){
      const a = startA + (totalAngle * i / steps);
      const r = (size/2.2) * (i / steps);
      const sx = drawCx + Math.cos(a) * r, sy = drawCy + Math.sin(a) * r;
      i === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
    }
    ctx.stroke();
  }
  if (skin.seeds){
    for (let i = 0; i < 5; i++){
      const seed = index * 7 + i * 13;
      const dx = ((seed * 9301 + 49297) % 233280) / 233280;
      const dy = ((seed * 4993 + 7919) % 233280) / 233280;
      ctx.fillStyle = 'rgba(255,240,200,0.85)';
      ctx.beginPath(); ctx.arc(drawX + 3 + dx * (size-6), drawY + 3 + dy * (size-6), 0.9, 0, Math.PI*2); ctx.fill();
    }
  }
  if (skin.sparkle){
    const sparkPhase = t*4 + index*0.6;
    if (Math.sin(sparkPhase) > 0.7){
      const sx = drawX + 4 + (Math.sin(sparkPhase*2.3) * 0.5 + 0.5) * (size - 8);
      const sy = drawY + 4 + (Math.cos(sparkPhase*1.7) * 0.5 + 0.5) * (size - 8);
      drawSparkle(sx, sy, 3.5, 'rgba(255,250,200,0.95)');
    }
  }
  if (skin.scales){
    ctx.strokeStyle = 'rgba(0,60,20,0.28)'; ctx.lineWidth = 1;
    for (let row = 0; row < 2; row++){
      for (let col = 0; col < 2; col++){
        const sx = drawX + 4 + col * 10, sy = drawY + 4 + row * 10;
        ctx.beginPath(); ctx.arc(sx + 3, sy + 3, 3.5, Math.PI, Math.PI * 2); ctx.stroke();
      }
    }
  }
  if (skin.gemGradient){
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(drawCx, drawY + 3); ctx.lineTo(drawX + size - 3, drawCy);
    ctx.lineTo(drawCx, drawY + size - 3); ctx.lineTo(drawX + 3, drawCy);
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(drawCx, drawCy, 1.5, 0, Math.PI*2); ctx.fill();
  }
  if (skin.shine && index < 4){
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.arc(drawCx - size*0.2, drawCy - size*0.25, 1.8, 0, Math.PI*2); ctx.fill();
  }
  if (skin.horn && index === 0){
    ctx.fillStyle = '#ffd76e';
    ctx.beginPath();
    const hornX = drawCx, hornY = drawCy;
    if (dir.x === 1) { ctx.moveTo(hornX + size*0.4, hornY - 2); ctx.lineTo(hornX + size*0.7, hornY); ctx.lineTo(hornX + size*0.4, hornY + 2); }
    else if (dir.x === -1) { ctx.moveTo(hornX - size*0.4, hornY - 2); ctx.lineTo(hornX - size*0.7, hornY); ctx.lineTo(hornX - size*0.4, hornY + 2); }
    else if (dir.y === 1) { ctx.moveTo(hornX - 2, hornY + size*0.4); ctx.lineTo(hornX, hornY + size*0.7); ctx.lineTo(hornX + 2, hornY + size*0.4); }
    else { ctx.moveTo(hornX - 2, hornY - size*0.4); ctx.lineTo(hornX, hornY - size*0.7); ctx.lineTo(hornX + 2, hornY - size*0.4); }
    ctx.closePath(); ctx.fill();
  }
  if (index === 0) drawFace(skin, cx, cy, dir, t, index);

  ctx.globalAlpha = 1;
}

function drawSparkle(x, y, size, color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - size);
  ctx.lineTo(x + size*0.3, y - size*0.3);
  ctx.lineTo(x + size, y);
  ctx.lineTo(x + size*0.3, y + size*0.3);
  ctx.lineTo(x, y + size);
  ctx.lineTo(x - size*0.3, y + size*0.3);
  ctx.lineTo(x - size, y);
  ctx.lineTo(x - size*0.3, y - size*0.3);
  ctx.closePath();
  ctx.fill();
}

function drawSnake(t){
  const skin = getSkin(state.active);
  const total = snake.length;
  for (let i = total - 1; i >= 0; i--){
    drawSegment(skin, snake[i].x, snake[i].y, i, total, t);
  }
}

function drawParticles(){
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life);
    if (p.type === 'heart') drawHeart(p.x, p.y, p.size * (0.6 + 0.4 * p.life), p.color);
    else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); ctx.fill(); }
  });
  ctx.globalAlpha = 1;
}

function drawHeart(x, y, size, color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + size * 0.3);
  ctx.bezierCurveTo(x, y, x - size/2, y, x - size/2, y + size * 0.3);
  ctx.bezierCurveTo(x - size/2, y + size * 0.7, x, y + size * 0.9, x, y + size * 1.1);
  ctx.bezierCurveTo(x, y + size * 0.9, x + size/2, y + size * 0.7, x + size/2, y + size * 0.3);
  ctx.bezierCurveTo(x + size/2, y, x, y, x, y + size * 0.3);
  ctx.fill();
}

/* ============================================================
   ОСНОВНОЙ ЦИКЛ
============================================================ */
function loop(now){
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  const mode = MODES[selectedMode];
  if (!paused) gameTime += dt;

  if (running && !paused) {
    if (timerRunning) {
      if (mode.timeLimit > 0) {
        timeRemaining -= dt;
        if (timeRemaining <= 0) {
          timeRemaining = 0;
          updateHUD();
          return winGame();
        }
        hudTimer.textContent = timeRemaining.toFixed(1);
        if (timeRemaining <= 10) hudTimer.classList.add('warning');
        else hudTimer.classList.remove('warning');
        time += dt;
      } else {
        time += dt;
        hudTimer.textContent = time.toFixed(1);
        hudTimer.classList.remove('warning');
      }
    }

    const speedOn = isBuffActive('speed');
    const baseStep = speedOn ? 0.145 / 1.75 : 0.145;
    tickAcc += dt;
    while (tickAcc >= baseStep) {
      tickAcc -= baseStep;
      step();
      if (!running) break;
    }

    if (running && mode.hasDemon) updateDemonSnake(dt);

    updateBuffs(dt);
    tickBuffsBarUI();
    updateCombo(dt);

    if (buffPickup) {
      buffPickup.life -= dt;
      if (buffPickup.life <= 0) buffPickup = null;
    } else {
      buffSpawnTimer -= dt;
      if (buffSpawnTimer <= 0) {
        spawnBuff();
        buffSpawnTimer = 12 + Math.random() * 8;
      }
    }

    if (mode.endlessFood) {
      endlessSpawnTimer -= dt;
      if (endlessSpawnTimer <= 0) {
        if (1 + extraFoods.length < 5) spawnExtraFood();
        endlessSpawnTimer = 2.5;
      }
    }
  }

  if (!paused) updateParticles(dt);
  if (foodEatenPulse > 0 && !paused) foodEatenPulse = Math.max(0, foodEatenPulse - dt * 3);

  let sx = 0, sy = 0;
  if (shake > 0 && !paused){
    sx = (Math.random() - 0.5) * shake;
    sy = (Math.random() - 0.5) * shake;
    shake *= 0.86;
    if (shake < 0.3) shake = 0;
  }
  ctx.save();
  ctx.translate(sx, sy);

  drawGrid();
  drawTrail();
  drawObstacles();
  drawFood();
  drawExtraFoods();
  drawBuffPickup();
  if (demonSnake) drawDemonSnake();
  if (snake) drawSnake(gameTime);
  drawParticles();

  if (foodEatenPulse > 0) {
    ctx.fillStyle = `rgba(255,255,255,${foodEatenPulse * 0.06})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  ctx.restore();
  requestAnimationFrame(loop);
}

============================================================ */
function setDir(nx, ny){
  if (!running || paused) return;
  if (nx === -dir.x && ny === -dir.y) return;
  if (nx === dir.x && ny === dir.y) return;
  nextDir = { x: nx, y: ny };
  SFX.sfx.turn();
}

document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if (caseOpenOverlay.classList.contains('show')) return;
  if (mobileShopScreen.classList.contains('open')) return;
  if (radioOpen) return;
  if (k === ' ' || k === 'p') {
    if (running) { e.preventDefault(); togglePause(); }
    return;
  }
  if (!running) { if (k === 'enter') startGame(); return; }
  if (paused) return;
  switch(k){
    case 'arrowup': case 'w': case 'ц': setDir(0,-1); break;
    case 'arrowdown': case 's': case 'ы': setDir(0,1); break;
    case 'arrowleft': case 'a': case 'ф': setDir(-1,0); break;
    case 'arrowright': case 'd': case 'в': setDir(1,0); break;
  }
});

/* ==== КРЕСТОВИНА ==== */
function bindDpadButton(btn, dx, dy){
  let pressed = false;
  const onPress = (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (pressed) return;
    pressed = true;
    btn.classList.add('pressed');
    SFX.resume();
    TelegramApp.hapticImpact('light');
    setDir(dx, dy);
  };
  const onRelease = (e) => {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    pressed = false;
    btn.classList.remove('pressed');
  };
  btn.addEventListener('touchstart', onPress, { passive: false });
  btn.addEventListener('touchend', onRelease, { passive: false });
  btn.addEventListener('touchcancel', onRelease, { passive: false });
  btn.addEventListener('mousedown', onPress);
  btn.addEventListener('mouseup', onRelease);
  btn.addEventListener('mouseleave', onRelease);
}

if (dpad) {
  bindDpadButton(dpad.querySelector('.dpad-up'), 0, -1);
  bindDpadButton(dpad.querySelector('.dpad-down'), 0, 1);
  bindDpadButton(dpad.querySelector('.dpad-left'), -1, 0);
  bindDpadButton(dpad.querySelector('.dpad-right'), 1, 0);
}

/* ==== СВАЙПЫ ПО ВСЕМУ ЭКРАНУ ==== */
let globalTouchStart = null;
const SWIPE_MIN_DIST = 24;

function shouldIgnoreSwipe(e){
  if (e.target.closest('.shop, .btn, button, .mobile-shop-screen, .mobile-shop-toggle, .corner-btn, .radio-panel, .case-open-overlay, .profile-in-menu, .dpad')) return true;
  if (mobileShopScreen.classList.contains('open')) return true;
  if (radioOpen) return true;
  if (caseOpenOverlay.classList.contains('show')) return true;
  if (overlay && !overlay.classList.contains('hidden')) return true;
  if (paused) return true;
  return false;
}

document.addEventListener('touchstart', (e) => {
  if (shouldIgnoreSwipe(e)) return;
  if (!running) return;
  if (e.touches.length !== 1) return;
  globalTouchStart = {
    x: e.touches[0].clientX,
    y: e.touches[0].clientY,
    time: Date.now(),
  };
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (!globalTouchStart) return;
  if (!running || paused) { globalTouchStart = null; return; }
  if (e.changedTouches.length === 0) { globalTouchStart = null; return; }
  if (shouldIgnoreSwipe(e)) { globalTouchStart = null; return; }

  const dx = e.changedTouches[0].clientX - globalTouchStart.x;
  const dy = e.changedTouches[0].clientY - globalTouchStart.y;
  const dist = Math.sqrt(dx*dx + dy*dy);

  if (dist < SWIPE_MIN_DIST) { globalTouchStart = null; return; }

  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
  else setDir(0, dy > 0 ? 1 : -1);
  globalTouchStart = null;
}, { passive: true });

document.addEventListener('touchcancel', () => { globalTouchStart = null; }, { passive: true });

});
document.getElementById('radioVolume').value = Math.round(Radio.getVolume() * 100);
document.getElementById('radioVolumeLabel').textContent = Math.round(Radio.getVolume() * 100) + '%';

function renderRadioPlaylist(){
  const list = Radio.getPlaylist();
  const el = document.getElementById('radioPlaylist');
  el.innerHTML = '';
  if (list.length === 0) {
    el.innerHTML = `<div class="radio-empty"><div class="radio-empty-icon">🎵</div><div>Плейлист пуст</div><div class="radio-empty-hint">Нажми «➕ Добавить» или положи треки в <b>music/</b></div></div>`;
    return;
  }
  list.forEach((track, index) => {
    const item = document.createElement('div');
    item.className = 'radio-track' + (index === Radio.getCurrentIndex() ? ' active' : '');
    item.innerHTML = `
      <div class="radio-track-icon">${track.icon || '🎵'}</div>
      <div class="radio-track-info">
        <div class="radio-track-name">${escapeHtml(track.name)}</div>
        <div class="radio-track-meta">${escapeHtml(track.artist || 'Аудиофайл')}</div>
      </div>
    `;
    if (track.kind === 'user') {
      const rm = document.createElement('button');
      rm.className = 'radio-track-remove';
      rm.textContent = '✕';
      rm.addEventListener('click', (ev) => {
        ev.stopPropagation();
        Radio.remove(index);
        renderRadioPlaylist();
        updateRadioUI();
      });
      item.appendChild(rm);
    }
    item.addEventListener('click', () => { SFX.resume(); SFX.sfx.click(); Radio.play(index); updateRadioUI(); });
    el.appendChild(item);
  });
}

function updateRadioUI(){
  const track = Radio.getCurrentTrack();
  const playing = Radio.isPlaying();
  document.getElementById('radioPlayBtn').textContent = playing ? '❚❚' : '▶';
  const toggle = document.getElementById('radioToggle');
  if (playing) toggle.classList.add('playing'); else toggle.classList.remove('playing');
  if (track) {
    document.getElementById('radioNowArt').textContent = track.icon || '🎵';
    if (playing) document.getElementById('radioNowArt').classList.add('playing');
    else document.getElementById('radioNowArt').classList.remove('playing');
    document.getElementById('radioNowTitle').textContent = track.name;
    document.getElementById('radioNowArtist').textContent = track.artist || 'Аудиофайл';
  } else {
    document.getElementById('radioNowArt').textContent = '🎵';
    document.getElementById('radioNowArt').classList.remove('playing');
    document.getElementById('radioNowTitle').textContent = 'Трек не выбран';
    document.getElementById('radioNowArtist').textContent = 'Добавь треки или положи их в music/';
  }
  updateProgressUI();
}

function updateProgressUI(){
  const { current, total, percent } = Radio.getProgress();
  const fill = document.getElementById('radioProgressFill');
  if (total > 0) {
    document.getElementById('radioTimeNow').textContent = formatTime(current);
    document.getElementById('radioTimeTotal').textContent = formatTime(total);
    fill.style.width = Math.min(100, percent) + '%';
  } else {
    document.getElementById('radioTimeNow').textContent = '0:00';
    document.getElementById('radioTimeTotal').textContent = '--:--';
    fill.style.width = '0%';
  }
}
function formatTime(sec){
  if (!Number.isFinite(sec)) return '--:--';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function startRadioProgressLoop(){ stopRadioProgressLoop(); radioProgressInterval = setInterval(() => { if (radioOpen) updateProgressUI(); }, 500); }
function stopRadioProgressLoop(){ if (radioProgressInterval) { clearInterval(radioProgressInterval); radioProgressInterval = null; } }

/* ============================================================
   СТАРТ
============================================================ */
function showStartOverlay(){
  const mode = MODES[selectedMode];
  const totalOwned = state.owned.length;
  const totalSkins = SKINS.length;
  const musicCount = Radio.getPlaylist().length;
  let line = `Режим: <b style="color:${mode.colorA}">${mode.icon} ${mode.name}</b>`;
  line += `<br><span style="color:#9a9ba4;font-size:12px">Привет, ${escapeHtml(profile.name)}! · Скинов: ${totalOwned}/${totalSkins}`;
  if (musicCount > 0) line += ` · 🎵 ${musicCount}`;
  line += `</span>`;
  ovTitle.textContent = state.gamesPlayed > 0 ? 'С возвращением!' : 'Змейка Telegram';
  ovText.innerHTML = line;
  ovBtn.textContent = state.gamesPlayed > 0 ? '▶ Продолжить' : '▶ Играть';
  overlay.classList.remove('hidden');
}

function startGame(){
  SFX.resume();
  SFX.sfx.start();
  TelegramApp.hapticImpact('medium');
  overlay.classList.add('hidden');
  closeMobileShop();
  if (dpad) dpad.classList.remove('hidden');
  resetGame();
}
ovBtn.onclick = startGame;
playBtn.onclick = () => { if (!running) startGame(); };

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
============================================================ */
TelegramApp.init();

resetGame();
running = false;
timerRunning = false;
showStartOverlay();

renderModes();
renderCases();
renderCollection();
renderProfile();
renderRadioPlaylist();
updateRadioUI();
requestAnimationFrame(loop);

(async () => {
  const count = await Radio.init();
  renderRadioPlaylist();
  updateRadioUI();
  if (count > 0) showToast(`🎵 Загружено треков из music/: ${count}`, 'success', 2500);
})();

const onceInteraction = () => {
  SFX.resume();
  document.removeEventListener('pointerdown', onceInteraction);
  document.removeEventListener('keydown', onceInteraction);
  document.removeEventListener('touchstart', onceInteraction);
};
document.addEventListener('pointerdown', onceInteraction, { once: true });
document.addEventListener('keydown', onceInteraction, { once: true });
document.addEventListener('touchstart', onceInteraction, { once: true });
</script>
</body>
