<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Змейка">
<title>🐍 Змейка — Telegram Edition v2.7</title>
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22%D0%97%D0%BC%D0%B5%D0%B9%D0%BA%D0%B0%22%2C%22short_name%22%3A%22Snake%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f0f17%22%2C%22theme_color%22%3A%22%230f0f17%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D%2527http%253A%2F%2Fwww.w3.org%2F2000%2Fsvg%2527%2520viewBox%253D%25270%25200%252064%252064%2527%253E%253Crect%2520width%253D%252764%2527%2520height%253D%252764%2527%2520rx%253D%252714%2527%2520fill%253D%2527%25230f0f17%2527%2F%253E%253Ctext%2520x%253D%252732%2527%2520y%253D%252744%2527%2520font-size%253D%252740%2527%2520text-anchor%253D%2527middle%2527%253E%25F0%259F%2590%258D%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ============================================================
     ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
  ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  :root {
    --gap: 14px;
    --radius: 18px;

    /* Цвета (по умолчанию) */
    --bg-deep: #0f0f17;
    --bg-panel: #1c1d26;
    --bg-panel-2: #23242e;
    --bg-elevated: #2a2b36;
    --bg-hover: #33343f;
    --bg-active: #3d3e4a;

    --border-soft: rgba(255,255,255,.08);
    --border-mid: rgba(255,255,255,.14);
    --border-strong: rgba(255,255,255,.22);

    --text-primary: #f0f1f5;
    --text-secondary: #a5a7b3;
    --text-muted: #737582;

    --accent: #7c8aff;
    --accent-2: #b5a4d4;
    --accent-3: #e0a47a;
    --success: #7fb87f;
    --danger: #d07a7a;

    --common: #8a8e96;
    --uncommon: #7fb87f;
    --rare: #5c9dff;
    --epic: #b57aff;
    --legendary: #ffb545;

    --shadow-soft: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.25);
    --shadow-mid: 0 2px 4px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --shadow-deep: 0 4px 8px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.45);

    /* Сильные тени для кнопок — чтобы не сливались с фоном */
    --shadow-btn: 0 2px 0 rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1);
    --shadow-btn-active: 0 1px 0 rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05);

    --tg-safe-top: 0px;
    --tg-safe-bottom: 0px;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    position: relative;
    touch-action: manipulation;
  }

  /* Тонкая текстура фона */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.025) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,.018) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* ============================================================
     УГЛОВЫЕ КНОПКИ — оптимизированы против слияния с UI Telegram
  ============================================================ */
  .corner-btn {
    position: fixed;
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: linear-gradient(180deg, var(--bg-elevated) 0%, var(--bg-panel) 100%);
    border: 1.5px solid var(--border-strong);
    color: var(--text-primary);
    font-size: 20px;
    cursor: pointer;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .1s, background .15s, border-color .15s;
    box-shadow: var(--shadow-btn);
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .corner-btn:hover {
    background: linear-gradient(180deg, var(--bg-hover) 0%, var(--bg-elevated) 100%);
    border-color: rgba(124,138,255,.4);
  }
  .corner-btn:active {
    transform: scale(.94);
    box-shadow: var(--shadow-btn-active);
  }

  .sound-toggle {
    top: calc(10px + env(safe-area-inset-top) + var(--tg-safe-top));
    right: 10px;
  }
  .sound-toggle.muted {
    background: var(--bg-panel);
    color: var(--text-muted);
    opacity: .8;
  }
  .sound-toggle.muted::after {
    content: '';
    position: absolute;
    width: 26px;
    height: 2px;
    background: currentColor;
    transform: rotate(-45deg);
    border-radius: 2px;
  }

  .radio-toggle {
    bottom: calc(10px + env(safe-area-inset-bottom) + var(--tg-safe-bottom));
    left: 10px;
    background: linear-gradient(180deg, #3a3c4e 0%, #262833 100%);
    border-color: rgba(124,138,255,.35);
    font-size: 22px;
  }
  .radio-toggle:hover {
    background: linear-gradient(180deg, #44465a 0%, #2d2f3d 100%);
    border-color: rgba(124,138,255,.55);
  }
  .radio-toggle.playing::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 18px;
    border: 2px solid var(--accent);
    opacity: .6;
    animation: radioPulse 2s infinite ease-out;
    pointer-events: none;
  }
  @keyframes radioPulse {
    0% { transform: scale(1); opacity: .6; }
    100% { transform: scale(1.2); opacity: 0; }
  }
  .radio-toggle.playing::after {
    content: '';
    position: absolute;
    top: 5px;
    right: 5px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #7fb87f;
    box-shadow: 0 0 8px rgba(127,184,127,.9);
    animation: radioDot 1.2s infinite alternate;
  }
  @keyframes radioDot {
    from { opacity: 1; transform: scale(1); }
    to { opacity: .5; transform: scale(.85); }
  }

  /* ============================================================
     ОСНОВНОЙ КОНТЕЙНЕР
  ============================================================ */
  .game-wrap {
    position: relative;
    z-index: 1;
    display: flex;
    gap: var(--gap);
    padding: var(--gap);
    width: 100%;
    height: 100%;
    max-width: 1400px;
    max-height: 100vh;
    max-height: 100dvh;
  }

  .board-panel {
    position: relative;
    padding: 10px;
    background: var(--bg-panel);
    border-radius: var(--radius);
    box-shadow: var(--shadow-mid), 0 0 0 1px rgba(255,255,255,.04);
    border: 1px solid var(--border-soft);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  /* ============================================================
     HUD
  ============================================================ */
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding: 0 2px;
    gap: 6px;
    flex-wrap: wrap;
  }
  .hud .stat {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    font-weight: 600;
    background: var(--bg-elevated);
    padding: 6px 11px;
    border-radius: 10px;
    border: 1px solid var(--border-soft);
    white-space: nowrap;
    color: var(--text-secondary);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
  }
  .hud .stat .val {
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }
  .hud .stat .val.apples { color: var(--accent-3); }
  .hud .stat .val.timer { color: var(--accent); }
  .hud .stat .val.timer.warning {
    color: var(--danger);
    animation: timerPulse .6s infinite alternate;
  }
  @keyframes timerPulse {
    from { opacity: 1; }
    to { opacity: .4; }
  }
  .hud .stat .val.score { color: var(--accent-2); }

  .hud .stat.combo {
    background: linear-gradient(90deg, rgba(255,181,69,.2), rgba(255,215,120,.1));
    border-color: rgba(255,181,69,.4);
    opacity: 0;
    transform: scale(.8);
    transition: opacity .2s, transform .2s;
  }
  .hud .stat.combo.show {
    opacity: 1;
    transform: scale(1);
    animation: comboPulse .3s;
  }
  @keyframes comboPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .hud .stat.combo .val { color: var(--legendary); }

  /* ============================================================
     CANVAS
  ============================================================ */
  .canvas-wrap {
    position: relative;
    line-height: 0;
    border-radius: 12px;
    overflow: hidden;
    background: var(--bg-panel-2);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 4px 16px rgba(0,0,0,.35);
  }

  canvas {
    display: block;
    border-radius: 12px;
    background: #1a1b22;
    touch-action: none;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
  }

  /* ============================================================
     ПАНЕЛЬ УСИЛИТЕЛЕЙ
  ============================================================ */
  .buffs-bar {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    padding: 6px 2px 0 2px;
    min-height: 56px;
    justify-content: center;
    flex-wrap: wrap;
    align-items: center;
    transition: all .25s;
  }
  .buffs-bar.empty::after {
    content: 'Здесь появятся активные усилители';
    color: var(--text-muted);
    font-size: 11.5px;
    font-style: italic;
  }

  .buff-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px 6px 6px;
    border-radius: 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-mid);
    position: relative;
    overflow: hidden;
    min-width: 105px;
    animation: buffIn .35s cubic-bezier(.2,.9,.3,1.3);
    box-shadow: var(--shadow-soft);
  }
  @keyframes buffIn {
    from { opacity: 0; transform: scale(.7) translateY(-10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .buff-chip.ending { animation: buffEnding .8s infinite; }
  @keyframes buffEnding {
    0%, 100% { opacity: 1; }
    50% { opacity: .5; }
  }

  .buff-chip .buff-icon {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    background: linear-gradient(135deg, var(--buff-color-a), var(--buff-color-b));
    box-shadow: inset 0 -2px 6px rgba(0,0,0,.3), inset 0 2px 4px rgba(255,255,255,.2);
    flex-shrink: 0;
    position: relative;
  }
  .buff-chip .buff-icon::after {
    content: '';
    position: absolute;
    top: 4px;
    left: 6px;
    width: 11px;
    height: 4px;
    border-radius: 50%;
    background: rgba(255,255,255,.4);
    filter: blur(1.5px);
  }
  .buff-chip .buff-info {
    display: flex;
    flex-direction: column;
    gap: 1px;
    flex: 1;
    min-width: 0;
  }
  .buff-chip .buff-name {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
  }
  .buff-chip .buff-time {
    font-size: 12px;
    font-weight: 700;
    color: var(--buff-color-a);
    font-variant-numeric: tabular-nums;
  }
  .buff-chip .buff-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--buff-color-a), var(--buff-color-b));
    transition: width .1s linear;
    border-radius: 0 3px 3px 0;
  }
  .buff-chip.magnet     { --buff-color-a: #ff8ba7; --buff-color-b: #d04a6e; }
  .buff-chip.speed      { --buff-color-a: #ffe066; --buff-color-b: #d4a017; }
  .buff-chip.ghost      { --buff-color-a: #b5a4d4; --buff-color-b: #7a6a9a; }
  .buff-chip.multifruit { --buff-color-a: #7fb87f; --buff-color-b: #4a8a4a; }

  /* ============================================================
     КРЕСТОВИНА GAME BOY (плавающая, полупрозрачная)
  ============================================================ */
  .dpad {
    display: none;
    position: fixed;
    bottom: calc(70px + env(safe-area-inset-bottom) + var(--tg-safe-bottom));
    left: 50%;
    transform: translateX(-50%);
    width: 330px;
    height: 330px;
    margin: 0;
    flex-shrink: 0;
    touch-action: none;
    user-select: none;
    z-index: 45;
    opacity: .55;
    transition: opacity .2s;
    pointer-events: auto;
  }
  .dpad.hidden { display: none !important; }
  .dpad:active,
  .dpad.pressed { opacity: .95; }

  .dpad-base {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.1), transparent 45%),
      radial-gradient(circle at 65% 75%, rgba(0,0,0,.4), transparent 50%),
      linear-gradient(145deg, #3a3b48 0%, #23242e 55%, #1a1b22 100%);
    box-shadow:
      inset 0 2px 4px rgba(255,255,255,.1),
      inset 0 -4px 12px rgba(0,0,0,.6),
      0 8px 24px rgba(0,0,0,.5),
      0 2px 6px rgba(0,0,0,.35);
    border: 2px solid rgba(255,255,255,.12);
  }
  .dpad-base::after {
    content: '';
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 40% 35%, rgba(255,255,255,.06), transparent 55%),
      linear-gradient(145deg, #2a2b35, #1e1f26);
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,.5),
      inset 0 -1px 2px rgba(255,255,255,.04);
  }

  .dpad-cross {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .dpad-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.12), transparent 50%),
      linear-gradient(145deg, #2e2f3a, #1c1d24);
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,.1),
      inset 0 -2px 4px rgba(0,0,0,.6),
      0 2px 6px rgba(0,0,0,.5);
    z-index: 3;
    pointer-events: none;
  }
  .dpad-center::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #555, #111);
    box-shadow: inset 0 -1px 2px rgba(0,0,0,.7), 0 1px 2px rgba(255,255,255,.08);
  }

  .dpad-btn {
    position: absolute;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    z-index: 2;
    transition: transform .08s;
    -webkit-tap-highlight-color: transparent;
    pointer-events: auto;
    touch-action: none;
  }
  .dpad-btn::before {
    content: '';
    position: absolute;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.18), transparent 50%),
      linear-gradient(145deg, #4a4b58 0%, #2c2d38 60%, #22232b 100%);
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,.18),
      inset 0 -3px 6px rgba(0,0,0,.6),
      0 3px 8px rgba(0,0,0,.5),
      0 0 0 1px rgba(255,255,255,.08);
    transition: box-shadow .1s, background .1s;
  }
  .dpad-btn:active::before,
  .dpad-btn.pressed::before {
    background:
      radial-gradient(circle at 35% 30%, rgba(124,138,255,.25), transparent 50%),
      linear-gradient(145deg, #2a2b35, #1e1f26);
    box-shadow:
      inset 0 3px 5px rgba(0,0,0,.6),
      inset 0 -1px 2px rgba(255,255,255,.1),
      0 1px 3px rgba(0,0,0,.4),
      0 0 12px rgba(124,138,255,.5);
  }
  .dpad-btn:active,
  .dpad-btn.pressed { transform: scale(.96); }

  .dpad-up {
    top: 3px;
    left: 50%;
    transform: translateX(-50%);
    width: 58px;
    height: 62px;
  }
  .dpad-up::before {
    inset: 0;
    border-radius: 28px 28px 10px 10px;
  }
  .dpad-up:active,
  .dpad-up.pressed { transform: translateX(-50%) scale(.96); }

  .dpad-down {
    bottom: 3px;
    left: 50%;
    transform: translateX(-50%);
    width: 58px;
    height: 62px;
  }
  .dpad-down::before {
    inset: 0;
    border-radius: 10px 10px 28px 28px;
  }
  .dpad-down:active,
  .dpad-down.pressed { transform: translateX(-50%) scale(.96); }

  .dpad-left {
    left: 3px;
    top: 50%;
    transform: translateY(-50%);
    width: 62px;
    height: 58px;
  }
  .dpad-left::before {
    inset: 0;
    border-radius: 28px 10px 10px 28px;
  }
  .dpad-left:active,
  .dpad-left.pressed { transform: translateY(-50%) scale(.96); }

  .dpad-right {
    right: 3px;
    top: 50%;
    transform: translateY(-50%);
    width: 62px;
    height: 58px;
  }
  .dpad-right::before {
    inset: 0;
    border-radius: 10px 28px 28px 10px;
  }
  .dpad-right:active,
  .dpad-right.pressed { transform: translateY(-50%) scale(.96); }

  .dpad-btn .dpad-arrow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 16px;
    font-weight: 900;
    color: rgba(255,255,255,.6);
    text-shadow:
      0 -1px 0 rgba(0,0,0,.6),
      0 1px 1px rgba(255,255,255,.1);
    pointer-events: none;
    z-index: 1;
  }
  .dpad-btn:active .dpad-arrow,
  .dpad-btn.pressed .dpad-arrow {
    color: rgba(124,138,255,.95);
    text-shadow:
      0 -1px 0 rgba(0,0,0,.7),
      0 0 10px rgba(124,138,255,.8);
  }

  /* ============================================================
     ПАУЗА
  ============================================================ */
  .pause-indicator {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(15,15,23,.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 8;
    border-radius: 12px;
    pointer-events: none;
    animation: pauseFadeIn .25s ease;
  }
  .pause-indicator.show { display: flex; }
  @keyframes pauseFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .pause-icon {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: rgba(42,43,54,.9);
    border: 2px solid rgba(124,138,255,.4);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    box-shadow: 0 8px 32px rgba(0,0,0,.6);
    animation: pausePulse 2s infinite ease-in-out;
  }
  @keyframes pausePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  .pause-icon .bar {
    width: 9px;
    height: 34px;
    background: var(--accent);
    border-radius: 4px;
    box-shadow: 0 0 12px rgba(124,138,255,.7);
  }
  .pause-label {
    position: absolute;
    bottom: 20%;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-primary);
    opacity: .85;
  }

  /* ============================================================
     МЕНЮ
  ============================================================ */
  .shop {
    background: var(--bg-panel);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow-mid), 0 0 0 1px rgba(255,255,255,.04);
    border: 1px solid var(--border-soft);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .shop-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    flex-shrink: 0;
    gap: 8px;
  }
  .shop h2 {
    font-size: 15px;
    color: var(--text-primary);
    letter-spacing: .3px;
    font-weight: 600;
  }
  .shop-wallet {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-3);
    background: var(--bg-elevated);
    padding: 4px 9px;
    border-radius: 8px;
    border: 1px solid var(--border-soft);
    font-variant-numeric: tabular-nums;

  .shop-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
    flex-shrink: 0;
    background: var(--bg-elevated);
    padding: 4px;
    border-radius: 10px;
  }
  .shop-tab {
    flex: 1;
    padding: 8px 4px;
    border-radius: 7px;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, color .15s;
    font-family: inherit;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .shop-tab:hover { color: var(--text-primary); }
  .shop-tab.active {
    background: var(--bg-hover);
    color: var(--text-primary);
    box-shadow: var(--shadow-soft);
  }

  .shop-pane {
    display: none;
    flex: 1;
    min-height: 0;
    flex-direction: column;
  }
  .shop-pane.active { display: flex; }

  .shop-list {
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-right: 4px;
    flex: 1;
    min-height: 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border-mid) transparent;
    -webkit-overflow-scrolling: touch;
  }
  .shop-list::-webkit-scrollbar { width: 6px; }
  .shop-list::-webkit-scrollbar-thumb {
    background: var(--border-mid);
    border-radius: 10px;
  }

  .mode-card {
    position: relative;
    border-radius: 14px;
    padding: 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-soft);
    cursor: pointer;
    transition: transform .15s, border-color .15s, background .15s;
    overflow: hidden;
  }
  .mode-card:hover {
    transform: translateY(-2px);
    border-color: var(--border-mid);
    background: var(--bg-hover);
  }
  .mode-card:active { transform: translateY(0) scale(.99); }
  .mode-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 14px;
    padding: 1px;
    background: linear-gradient(135deg, var(--mode-color-a), var(--mode-color-b));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: .5;
    pointer-events: none;
  }
  .mode-card.selected {
    background: var(--bg-active);
    box-shadow: inset 0 0 0 2px var(--mode-color-a), 0 0 20px rgba(124,138,255,.2);
  }
  .mode-card.classic  { --mode-color-a: #7fb87f; --mode-color-b: #4a8a4a; }
  .mode-card.hardcore { --mode-color-a: #d07a7a; --mode-color-b: #8a2020; }
  .mode-card.endless  { --mode-color-a: #7c8aff; --mode-color-b: #4a4fc4; }

  .mode-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .mode-icon {
    width: 44px;
    height: 44px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    background: linear-gradient(135deg, var(--mode-color-a), var(--mode-color-b));
    box-shadow: 0 4px 14px rgba(0,0,0,.4), inset 0 -4px 8px rgba(0,0,0,.3), inset 0 4px 8px rgba(255,255,255,.15);
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .mode-icon::after {
    content: '';
    position: absolute;
    top: 6px;
    left: 8px;
    width: 18px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,.35);
    filter: blur(2px);
  }
  .mode-info { flex: 1; min-width: 0; }
  .mode-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 2px;
  }
  .mode-desc {
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.4;
  }
  .mode-stats {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 8px;
    border-top: 1px solid var(--border-soft);
    font-size: 11px;
  }
  .mode-stats-label { color: var(--text-muted); }
  .mode-stats-val {
    color: var(--legendary);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .case-card {
    position: relative;
    border-radius: 14px;
    padding: 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-soft);
    cursor: pointer;
    transition: transform .15s, border-color .15s, background .15s;
    overflow: hidden;
  }
  .case-card:hover {
    transform: translateY(-2px);
    border-color: var(--border-mid);
    background: var(--bg-hover);
  }
  .case-card:active { transform: translateY(0) scale(.99); }
  .case-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 14px;
    padding: 1px;
    background: linear-gradient(135deg, var(--case-color-a), var(--case-color-b));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: .55;
    pointer-events: none;
    transition: opacity .15s;
  }
  .case-card:hover::before { opacity: 1; }
  .case-card.emerald  { --case-color-a: #2fbf71; --case-color-b: #0f7a4a; }
  .case-card.ruby     { --case-color-a: #ff4a6e; --case-color-b: #b02040; }
  .case-card.sapphire { --case-color-a: #4a9eff; --case-color-b: #1a4fb8; }
  .case-card.amethyst { --case-color-a: #b57aff; --case-color-b: #6a2fc4; }

  .case-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .case-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    background: linear-gradient(135deg, var(--case-color-a), var(--case-color-b));
    box-shadow: 0 4px 14px rgba(0,0,0,.4), inset 0 -4px 8px rgba(0,0,0,.3), inset 0 4px 8px rgba(255,255,255,.15);
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .case-icon::after {
    content: '';
    position: absolute;
    top: 6px;
    left: 8px;
    width: 18px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,.35);
    filter: blur(2px);
  }
  .case-info { flex: 1; min-width: 0; }
  .case-name {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 3px;
  }
  .case-sub {
    font-size: 11px;
    color: var(--text-secondary);
  }
  .case-price {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 10px;
    border-top: 1px solid var(--border-soft);
    font-size: 12px;
  }
  .case-price-label { color: var(--text-muted); }
  .case-price-val {
    color: var(--accent-3);
    font-weight: 700;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .case-price-val.cant-afford { color: var(--danger); }

  .collection-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    overflow-y: auto;
    padding-right: 4px;
    flex: 1;
    min-height: 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border-mid) transparent;
    -webkit-overflow-scrolling: touch;
  }
  .collection-grid::-webkit-scrollbar { width: 6px; }
  .collection-grid::-webkit-scrollbar-thumb {
    background: var(--border-mid);
    border-radius: 10px;
  }

  .skin-tile {
    position: relative;
    border-radius: 12px;
    padding: 8px 6px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-soft);
    cursor: pointer;
    transition: transform .15s, border-color .15s;
    text-align: center;
    overflow: hidden;
  }
  .skin-tile:hover { transform: translateY(-2px); }
  .skin-tile:active { transform: scale(.97); }
  .skin-tile.active {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .skin-tile.locked { opacity: .38; cursor: default; }
  .skin-tile.locked:hover { transform: none; }
  .skin-tile-preview {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    margin-bottom: 6px;
    box-shadow: inset 0 0 15px rgba(0,0,0,.4);
    position: relative;
    overflow: hidden;
  }
  .skin-tile.locked .skin-tile-preview { filter: grayscale(1) brightness(.4); }
  .skin-tile-name {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .skin-tile.locked .skin-tile-name { color: var(--text-muted); }

  .rarity-badge {
    display: inline-block;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .6px;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--bg-active);
    color: var(--text-muted);
  }
  .rarity-badge.common    { background: rgba(138,142,150,.18); color: var(--common); }
  .rarity-badge.uncommon  { background: rgba(127,184,127,.18); color: var(--uncommon); }
  .rarity-badge.rare      { background: rgba(92,157,255,.18); color: var(--rare); }
  .rarity-badge.epic      { background: rgba(181,122,255,.18); color: var(--epic); }
  .rarity-badge.legendary {
    background: linear-gradient(90deg, rgba(255,181,69,.25), rgba(255,215,120,.25));
    color: var(--legendary);
    animation: legendaryBadge 2s infinite alternate;
  }
  @keyframes legendaryBadge {
    from { box-shadow: 0 0 0 rgba(255,181,69,0); }
    to { box-shadow: 0 0 12px rgba(255,181,69,.5); }
  }

  .profile-in-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    padding-right: 4px;
    flex: 1;
    min-height: 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border-mid) transparent;
  }
  .profile-in-menu::-webkit-scrollbar { width: 6px; }
  .profile-in-menu::-webkit-scrollbar-thumb {
    background: var(--border-mid);
    border-radius: 10px;
  }

  .profile-avatar-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 4px 0;
    flex-shrink: 0;
  }
  .profile-avatar {
    width: 60px;
    height: 60px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    box-shadow: 0 4px 14px rgba(124,138,255,.35), inset 0 -4px 8px rgba(0,0,0,.25), inset 0 4px 8px rgba(255,255,255,.15);
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform .15s;
  }
  .profile-avatar:hover { transform: scale(1.05); }
  .profile-avatar::after {
    content: '';
    position: absolute;
    top: 6px;
    left: 10px;
    width: 20px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,.4);
    filter: blur(2px);
  }
  .profile-name-block { flex: 1; min-width: 0; }
  .profile-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    padding: 2px 6px;
    margin-left: -6px;
    border-radius: 6px;
    transition: background .15s;
  }
  .profile-name:hover { background: var(--bg-elevated); }
  .profile-name-edit {
    font-size: 10.5px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .profile-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    flex-shrink: 0;
  }
  .profile-stat {
    background: rgba(0,0,0,.25);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 9px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .profile-stat .label {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: .3px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .profile-stat .value {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }
  .profile-stat .value.gold { color: var(--legendary); }
  .profile-stat .value.blue { color: var(--accent); }
  .profile-stat .value.green { color: var(--success); }

  .profile-section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-muted);
    padding-top: 6px;
    flex-shrink: 0;
  }

  .rarity-progress {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }
  .rarity-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
  }
  .rarity-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .rarity-row.common .rarity-dot { background: var(--common); }
  .rarity-row.uncommon .rarity-dot { background: var(--uncommon); }
  .rarity-row.rare .rarity-dot { background: var(--rare); }
  .rarity-row.epic .rarity-dot { background: var(--epic); }
  .rarity-row.legendary .rarity-dot {
    background: var(--legendary);
    box-shadow: 0 0 8px var(--legendary);
  }
  .rarity-row .label {
    color: var(--text-secondary);
    flex: 1;
    font-weight: 600;
  }
  .rarity-row .count {
    color: var(--text-primary);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .rarity-row .count.done { color: var(--success); }

  .btn-danger {
    padding: 10px;
    font-size: 12px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    background: rgba(208,122,122,.15);
    border: 1px solid rgba(208,122,122,.4);
    color: var(--danger);
    font-family: inherit;
    transition: background .15s;
    margin-top: 4px;
    flex-shrink: 0;
  }
  .btn-danger:hover { background: rgba(208,122,122,.25); }

  .btn-play {
    margin-top: 12px;
    padding: 13px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: #0a0a12;
    background: linear-gradient(180deg, #8b97ff 0%, #7c8aff 100%);
    border: 1.5px solid rgba(255,255,255,.2);
    border-radius: 12px;
    cursor: pointer;
    transition: background .15s, transform .1s;
    font-family: inherit;
    flex-shrink: 0;
    box-shadow: 0 3px 0 #4a4fb8, 0 6px 16px rgba(124,138,255,.4);
  }
  .btn-play:hover {
    background: linear-gradient(180deg, #98a2ff 0%, #8b97ff 100%);
  }
  .btn-play:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #4a4fb8, 0 2px 8px rgba(124,138,255,.3);
  }

  /* ============================================================
     OVERLAY
  ============================================================ */
  .overlay {
    position: absolute;
    inset: 10px;
    border-radius: 12px;
    background: rgba(15,15,23,.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    z-index: 10;
    padding: 20px;
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .overlay.hidden { display: none; }
  .overlay h1 {
    font-size: clamp(22px, 5vw, 30px);
    color: var(--text-primary);
    letter-spacing: -.5px;
    font-weight: 700;
  }
  .overlay p {
    color: var(--text-secondary);
    font-size: clamp(12px, 2.5vw, 14px);
    line-height: 1.7;
  }
  .overlay .big-stat {
    font-size: clamp(18px, 3.5vw, 22px);
    color: var(--accent-3);
    font-weight: 700;
  }
  .btn {
    padding: 12px 30px;
    font-size: 14px;
    font-weight: 800;
    border: 1.5px solid rgba(255,255,255,.2);
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s, transform .1s;
    background: linear-gradient(180deg, #8b97ff 0%, #7c8aff 100%);
    color: #0a0a12;
    letter-spacing: .5px;
    box-shadow: 0 3px 0 #4a4fb8, 0 6px 16px rgba(124,138,255,.4);
  }
  .btn:hover { background: linear-gradient(180deg, #98a2ff 0%, #8b97ff 100%); }
  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #4a4fb8, 0 2px 8px rgba(124,138,255,.3);
  }

  /* ============================================================
     КЕЙСЫ
  ============================================================ */
  .case-open-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(8,8,14,.96);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 1000;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn .3s ease;
  }
  .case-open-overlay.show { display: flex; }
  .case-open-header {
    text-align: center;
    margin-bottom: 30px;
    flex-shrink: 0;
  }
  .case-open-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: .5px;
  }
  .case-open-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  .roulette-wrap {
    position: relative;
    width: 100%;
    max-width: 720px;
    height: 130px;
    margin-bottom: 30px;
    overflow: hidden;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(0,0,0,.5), rgba(0,0,0,.2));
    border: 1px solid var(--border-mid);
    box-shadow: inset 0 0 30px rgba(0,0,0,.6);
    flex-shrink: 0;
  }
  .roulette-wrap::before,
  .roulette-wrap::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: 80px;
    z-index: 3;
    pointer-events: none;
  }
  .roulette-wrap::before {
    left: 0;
    background: linear-gradient(90deg, rgba(8,8,14,1), rgba(8,8,14,0));
  }
  .roulette-wrap::after {
    right: 0;
    background: linear-gradient(-90deg, rgba(8,8,14,1), rgba(8,8,14,0));
  }

  .roulette-marker {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 3px;
    background: linear-gradient(180deg, #ffb545, #ff5e7a);
    transform: translateX(-50%);
    z-index: 4;
    box-shadow: 0 0 12px rgba(255,181,69,.8);
    pointer-events: none;
  }
  .roulette-marker::before,
  .roulette-marker::after {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
  }
  .roulette-marker::before {
    top: -2px;
    border-top: 10px solid #ffb545;
  }
  .roulette-marker::after {
    bottom: -2px;
    border-bottom: 10px solid #ffb545;
  }

  .roulette-track {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    display: flex;
    align-items: center;
    transition: transform 5s cubic-bezier(.15, .6, .2, 1);
    will-change: transform;
    padding: 0 20px;
  }

  .roulette-item {
    flex-shrink: 0;
    width: 100px;
    height: 106px;
    margin: 0 5px;
    border-radius: 12px;
    background: var(--bg-elevated);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    border: 2px solid;
    position: relative;
    overflow: hidden;
  }
  .roulette-item.common    { border-color: var(--common); background: linear-gradient(160deg, rgba(138,142,150,.2), rgba(138,142,150,.05)); }
  .roulette-item.uncommon  { border-color: var(--uncommon); background: linear-gradient(160deg, rgba(127,184,127,.2), rgba(127,184,127,.05)); }
  .roulette-item.rare      { border-color: var(--rare); background: linear-gradient(160deg, rgba(92,157,255,.2), rgba(92,157,255,.05)); }
  .roulette-item.epic      { border-color: var(--epic); background: linear-gradient(160deg, rgba(181,122,255,.2), rgba(181,122,255,.05)); }
  .roulette-item.legendary {
    border-color: var(--legendary);
    background: linear-gradient(160deg, rgba(255,181,69,.25), rgba(255,215,120,.08));
    animation: legendaryItem 1.5s infinite alternate;
  }
  @keyframes legendaryItem {
    from { box-shadow: 0 0 8px rgba(255,181,69,.3); }
    to   { box-shadow: 0 0 24px rgba(255,181,69,.8), inset 0 0 20px rgba(255,181,69,.3); }
  }

  .roulette-item-icon {
    width: 52px;
    height: 52px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    box-shadow: inset 0 0 12px rgba(0,0,0,.5);
  }
  .roulette-item-name {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-primary);
    text-align: center;
    padding: 0 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .case-result {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    animation: resultIn .5s cubic-bezier(.2,.9,.3,1.3);
  }
  .case-result.show { display: flex; }
  @keyframes resultIn {
    from { opacity: 0; transform: scale(.6); }
    to { opacity: 1; transform: scale(1); }
  }

  .case-result-icon {
    width: 130px;
    height: 130px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,.6), inset 0 -6px 16px rgba(0,0,0,.4), inset 0 6px 16px rgba(255,255,255,.2);
    animation: resultFloat 3s infinite ease-in-out;
  }
  @keyframes resultFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .case-result-icon::after {
    content: '';
    position: absolute;
    inset: -20px;
    border-radius: 30px;
    background: inherit;
    filter: blur(20px);
    opacity: .5;
    z-index: -1;
    animation: resultGlow 2s infinite alternate;
  }
  @keyframes resultGlow {
    from { opacity: .3; }
    to { opacity: .7; }
  }

  .case-result-name {
    font-size: 22px;
    font-weight: 800;
    color: var(--text-primary);
    text-align: center;
    letter-spacing: -.3px;
  }
  .case-result-rarity {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 8px;
  }
  .case-result-rarity.common    { background: rgba(138,142,150,.2); color: var(--common); }
  .case-result-rarity.uncommon  { background: rgba(127,184,127,.2); color: var(--uncommon); }
  .case-result-rarity.rare      { background: rgba(92,157,255,.2); color: var(--rare); }
  .case-result-rarity.epic      { background: rgba(181,122,255,.2); color: var(--epic); }
  .case-result-rarity.legendary {
    background: linear-gradient(90deg, rgba(255,181,69,.3), rgba(255,215,120,.3));
    color: var(--legendary);
  }

  .case-result-actions {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn-secondary {
    padding: 12px 24px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s, transform .1s;
    background: var(--bg-elevated);
    color: var(--text-primary);
    border: 1.5px solid var(--border-mid);
    letter-spacing: .3px;
    box-shadow: var(--shadow-btn);
  }
  .btn-secondary:hover { background: var(--bg-hover); }
  .btn-secondary:active {
    transform: scale(.97);
    box-shadow: var(--shadow-btn-active);
  }

  .confetti {
    position: absolute;
    width: 8px;
    height: 14px;
    opacity: 0;
    pointer-events: none;
    animation: confettiFall 3s ease-out forwards;
  }
  @keyframes confettiFall {
    0% { opacity: 1; transform: translate(0, -100px) rotate(0deg); }
    100% { opacity: 0; transform: translate(var(--dx, 0px), 100vh) rotate(720deg); }
  }

  /* ============================================================
     МОБИЛЬНОЕ МЕНЮ
  ============================================================ */
  .mobile-shop-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg-deep);
    z-index: 200;
    flex-direction: column;
    padding: calc(14px + env(safe-area-inset-top) + var(--tg-safe-top)) 14px calc(14px + env(safe-area-inset-bottom) + var(--tg-safe-bottom)) 14px;
    transform: translateX(100%);
    transition: transform .28s cubic-bezier(.2,.9,.3,1);
    will-change: transform;
  }
  .mobile-shop-screen.open { transform: translateX(0); }
  .mobile-shop-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
  }
  .mobile-shop-header h2 {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -.3px;
  }
  .mobile-shop-header .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .mobile-shop-header .apples-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-3);
    background: var(--bg-elevated);

    border-radius: 10px;

  }
  .mobile-close-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--bg-elevated);
    color: var(--text-primary);
    border: 1.5px solid var(--border-mid);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, transform .1s;
    font-family: inherit;
    line-height: 1;
    box-shadow: var(--shadow-btn);
  }
  .mobile-close-btn:hover { background: var(--bg-hover); }
  .mobile-close-btn:active {
    transform: scale(.92);
    box-shadow: var(--shadow-btn-active);
  }

  .mobile-shop-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 4px 4px 20px 4px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
  }

  .mobile-shop-toggle {
    display: none;
    position: fixed;
    bottom: calc(14px + env(safe-area-inset-bottom) + var(--tg-safe-bottom));
    right: 14px;
    height: 54px;
    padding: 0 20px 0 16px;
    border-radius: 16px;
    background: linear-gradient(180deg, #8b97ff 0%, #7c8aff 100%);
    color: #0a0a12;
    border: 1.5px solid rgba(255,255,255,.25);
    font-size: 15px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    z-index: 50;
    align-items: center;
    gap: 8px;
    transition: transform .1s, background .15s;
    box-shadow: 0 3px 0 #4a4fb8, 0 8px 20px rgba(124,138,255,.5);
  }
  .mobile-shop-toggle:hover {
    background: linear-gradient(180deg, #98a2ff 0%, #8b97ff 100%);
  }
  .mobile-shop-toggle:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #4a4fb8, 0 3px 10px rgba(124,138,255,.4);
  }
  .mobile-shop-toggle .toggle-icon { font-size: 20px; }

  /* ============================================================
     РАДИО
  ============================================================ */
  .radio-panel {
    display: none;
    position: fixed;
    bottom: calc(70px + env(safe-area-inset-bottom) + var(--tg-safe-bottom));
    left: 12px;
    width: 340px;
    max-width: calc(100vw - 24px);
    background: linear-gradient(165deg, #2a2c3a 0%, #1e1f28 100%);
    border: 1.5px solid var(--border-mid);
    border-radius: 18px;
    box-shadow: var(--shadow-deep);
    z-index: 210;
    padding: 14px;
    flex-direction: column;
    gap: 12px;
    animation: radioSlideIn .28s cubic-bezier(.2,.9,.3,1.1);
    max-height: calc(100vh - 140px);
    overflow: hidden;
  }
  .radio-panel.open { display: flex; }
  @keyframes radioSlideIn {
    from { opacity: 0; transform: translateY(20px) scale(.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .radio-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
  }
  .radio-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .3px;
  }
  .radio-title-icon {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: linear-gradient(145deg, var(--accent), #5c6eff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    box-shadow: 0 2px 8px rgba(124,138,255,.4);
  }
  .radio-close {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-mid);
    color: var(--text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    transition: background .15s;
    font-family: inherit;
    box-shadow: var(--shadow-btn);
  }
  .radio-close:hover { background: var(--bg-hover); }
  .radio-close:active { transform: scale(.92); box-shadow: var(--shadow-btn-active); }

  .radio-now {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    background: rgba(0,0,0,.25);
    border-radius: 12px;
    border: 1px solid var(--border-soft);
    flex-shrink: 0;
  }
  .radio-now-art {
    width: 50px;
    height: 50px;
    border-radius: 10px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    position: relative;
    overflow: hidden;
  }
  .radio-now-art.playing::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(255,255,255,.2), transparent 70%);
    animation: radioArt 2s infinite alternate;
  }
  @keyframes radioArt {
    from { transform: scale(.8); opacity: .3; }
    to { transform: scale(1.2); opacity: .7; }
  }
  .radio-now-info { flex: 1; min-width: 0; }
  .radio-now-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .radio-now-artist {
    font-size: 11.5px;
    color: var(--text-secondary);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .radio-progress {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 10.5px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .radio-progress-track {
    flex: 1;
    height: 5px;
    background: rgba(255,255,255,.08);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }
  .radio-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 3px;
    width: 0%;
    transition: width .2s linear;
  }
  .radio-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .radio-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-mid);
    color: var(--text-primary);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, transform .1s;
    font-family: inherit;
    box-shadow: var(--shadow-btn);
  }
  .radio-btn:hover { background: var(--bg-hover); }
  .radio-btn:active {
    transform: scale(.92);
    box-shadow: var(--shadow-btn-active);
  }
  .radio-btn.play-btn-main {
    width: 54px;
    height: 54px;
    border-radius: 16px;
    background: linear-gradient(180deg, #8b97ff 0%, #7c8aff 100%);
    color: #0a0a12;
    font-size: 22px;
    border: 1.5px solid rgba(255,255,255,.2);
    box-shadow: 0 3px 0 #4a4fb8, 0 6px 16px rgba(124,138,255,.4);
  }
  .radio-btn.play-btn-main:hover {
    background: linear-gradient(180deg, #98a2ff 0%, #8b97ff 100%);
  }
  .radio-btn.play-btn-main:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #4a4fb8, 0 2px 8px rgba(124,138,255,.3);
  }
  .radio-playlist-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 8px;
    flex-shrink: 0;
  }
  .radio-playlist-header h3 {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .radio-add-btn {
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 8px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-mid);
    color: var(--text-primary);
    cursor: pointer;
    font-weight: 600;
    font-family: inherit;
    transition: background .15s;
    display: flex;
    align-items: center;
    gap: 4px;
    box-shadow: var(--shadow-btn);
  }
  .radio-add-btn:hover { background: var(--bg-hover); }
  .radio-add-btn:active { transform: scale(.96); }
  .radio-add-btn input { display: none; }
  .radio-playlist {
    overflow-y: auto;
    overflow-x: hidden;
    max-height: 180px;
    min-height: 60px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-right: 4px;
    margin: 0 -4px;
    scrollbar-width: thin;
    scrollbar-color: var(--border-mid) transparent;
    -webkit-overflow-scrolling: touch;
  }
  .radio-track {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    background: var(--bg-elevated);
    border: 1px solid transparent;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    flex-shrink: 0;
    position: relative;
  }
  .radio-track:hover { background: var(--bg-hover); }
  .radio-track.active {
    background: rgba(124,138,255,.12);
    border-color: var(--accent);
  }
  .radio-track.active::before {
    content: '▶';
    font-size: 9px;
    position: absolute;
    left: -2px;
    color: var(--accent);
    animation: trackPlaying 1.5s infinite alternate;
  }
  @keyframes trackPlaying {
    from { opacity: .4; }
    to { opacity: 1; }
  }
  .radio-track-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--bg-active);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .radio-track-info { flex: 1; min-width: 0; }
  .radio-track-name {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .radio-track-meta {
    font-size: 10.5px;
    color: var(--text-muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .radio-track-remove {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    opacity: 0;
    transition: opacity .15s, background .15s, color .15s;
    font-family: inherit;
    flex-shrink: 0;
  }
  .radio-track:hover .radio-track-remove { opacity: 1; }
  .radio-track-remove:hover {
    background: rgba(208,122,122,.2);
    color: var(--danger);
  }
  .radio-empty {
    text-align: center;
    padding: 18px 12px;
    color: var(--text-muted);
    font-size: 11.5px;
    line-height: 1.6;
  }
  .radio-empty-icon {
    font-size: 32px;
    margin-bottom: 8px;
    opacity: .5;
  }
  .radio-empty-hint {
    margin-top: 6px;
    font-size: 10.5px;
    color: var(--text-muted);
    font-style: italic;
  }
  .radio-volume {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--border-soft);
    font-size: 14px;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .radio-volume input[type="range"] {
    flex: 1;
    height: 5px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255,255,255,.1);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  .radio-volume input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(124,138,255,.7), 0 1px 3px rgba(0,0,0,.5);
    border: 1.5px solid rgba(255,255,255,.3);
  }
  .radio-volume input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 1.5px solid rgba(255,255,255,.3);
    cursor: pointer;
  }

  /* ============================================================
     TOAST
  ============================================================ */
  .toast-container {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top) + var(--tg-safe-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 500;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    pointer-events: none;
    width: 90%;
    max-width: 400px;
  }
  .toast {
    padding: 11px 16px;
    background: var(--bg-elevated);
    border: 1.5px solid var(--border-mid);
    border-radius: 12px;
    box-shadow: var(--shadow-deep);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
    animation: toastIn .3s cubic-bezier(.2,.9,.3,1.3);
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast.success { border-color: var(--success); color: var(--success); }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.info { border-color: var(--accent); color: var(--accent); }
  .toast.buff {
    border-color: var(--legendary);
    color: var(--legendary);
    font-size: 14px;
    padding: 13px 20px;
  }
  .toast.combo {
    border-color: var(--legendary);
    color: var(--legendary);
    font-size: 16px;
    padding: 12px 22px;
  }
  .toast.fade-out { animation: toastOut .3s forwards; }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-20px) scale(.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes toastOut {
    to { opacity: 0; transform: translateY(-20px) scale(.9); }
  }

  /* ============================================================
     DEVICE LAYOUTS
  ============================================================ */

  /* ===== ТЕЛЕФОН ===== */
  .device-phone .game-wrap {
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 6px;
    gap: 6px;
    overflow: hidden;
    height: 100dvh;
  }

  .device-phone .board-panel {
    width: 100%;
    max-width: 100%;
    padding: 6px;
    flex-shrink: 0;
    flex-grow: 0;
    max-height: 100%;
  }

  .device-phone .hud {
    margin-bottom: 5px;
    gap: 4px;
  }
  .device-phone .hud .stat {
    font-size: 11px;
    padding: 4px 8px;
    gap: 3px;
    border-radius: 8px;
  }
  .device-phone .hud .stat .val { font-size: 11px; }

  .device-phone .canvas-wrap {
    max-width: 100%;
    margin: 0 auto;
    width: 100%;
  }

  .device-phone .shop { display: none; }
  .device-phone .mobile-shop-toggle { display: flex; }
  .device-phone .mobile-shop-screen { display: flex; }
  .device-phone .dpad { display: block; }

  .device-phone .buffs-bar {
    min-height: 40px;
    padding: 4px 2px 0 2px;
    gap: 5px;
    margin-top: 5px;
  }
  .device-phone .buffs-bar.empty::after { font-size: 10.5px; }
  .device-phone .buff-chip {
    min-width: 85px;
    padding: 4px 8px 4px 4px;
    gap: 6px;
  }
  .device-phone .buff-chip .buff-icon {
    width: 26px;
    height: 26px;
    font-size: 15px;
    border-radius: 7px;
  }
  .device-phone .buff-chip .buff-name { font-size: 10px; }
  .device-phone .buff-chip .buff-time { font-size: 11px; }

  .device-phone .corner-btn {
    width: 44px;
    height: 44px;
    font-size: 19px;
    border-radius: 12px;
  }

  /* ===== ЛАНДШАФТ ===== */
  @media (orientation: landscape) and (max-height: 550px) {
    .device-phone .game-wrap {
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 6px;
    }
    .device-phone .board-panel {
      max-height: 100%;
      max-width: 60vw;
    }
    .device-phone .hud {
      margin-bottom: 4px;
    }
    .device-phone .hud .stat {
      font-size: 10.5px;
      padding: 3px 7px;
    }
    .device-phone .buffs-bar {
      min-height: 34px;

<script>
/* ============================================================
   TELEGRAM WEBAPP INIT
============================================================ */
const TelegramApp = (() => {
  const tg = window.Telegram?.WebApp;
  let isActive = false;

  function init(){
    if (!tg) return;
    try {
      tg.ready();
      tg.expand();
      isActive = true;
      document.body.classList.add('tg-webapp');

      // Устанавливаем CSS переменные из Telegram themeParams
      // (используем только если хочется полной интеграции — иначе оставляем свои цвета)
      applyTheme();

      // Слушаем изменения темы
      if (tg.onEvent) {
        tg.onEvent('themeChanged', applyTheme);
        tg.onEvent('viewportChanged', onViewportChanged);
      }

      // Отключаем вертикальные свайпы Telegram в области игры
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();

      // Разрешаем закрытие по свайпу вниз (если пользователь захочет)
      if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();

      // Обработка "назад" — закрываем радио/меню
      if (tg.BackButton) {
        tg.BackButton.onClick(() => {
          if (radioOpen) { closeRadioPanel(); return; }
          if (mobileShopScreen.classList.contains('open')) { closeMobileShop(); return; }
        });
      }
    } catch(e) {
      console.warn('Telegram WebApp init error:', e);
    }
  }

  function applyTheme(){
    if (!tg || !tg.themeParams) return;
    const tp = tg.themeParams;
    const root = document.documentElement;

    // Если Telegram в тёмной теме — оставляем наши цвета
    // Если в светлой — можно было бы поменять, но у нас тёмный геймплей
    // Оставляем свой стиль, только забираем safe area

    // Применяем safe area
    if (tg.viewportStableHeight) {
      onViewportChanged();
    }
  }

  function onViewportChanged(){
    if (!tg) return;
    const root = document.documentElement;
    // Telegram WebApp — viewportStableHeight не включает клавиатуру, нам это подходит
    // Высоту не трогаем, просто даём браузеру разобраться через dvh
  }

  function hapticImpact(style = 'light'){
    if (!tg || !tg.HapticFeedback) return;
    try { tg.HapticFeedback.impactOccurred(style); } catch(e){}
  }
  function hapticNotify(type = 'success'){
    if (!tg || !tg.HapticFeedback) return;
    try { tg.HapticFeedback.notificationOccurred(type); } catch(e){}
  }

  return { init, hapticImpact, hapticNotify, isActive: () => isActive };
})();

/* ============================================================
   ГЛОБАЛЬНЫЙ MUTE
============================================================ */
const GlobalMute = {
  muted: false,
  listeners: [],
  set(v){ this.muted = v; this.listeners.forEach(fn => { try { fn(v); } catch(e){} }); },
  get(){ return this.muted; },
  onChange(fn){ this.listeners.push(fn); }
};

/* ============================================================
   SFX
============================================================ */
const SFX = (() => {
  let ctx = null, sfxGain = null;
  function init(){
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      sfxGain = ctx.createGain();
      sfxGain.gain.value = 0.5;
      sfxGain.connect(ctx.destination);
    } catch(e) {}
  }
  function resume(){ init(); if (ctx && ctx.state === 'suspended') ctx.resume(); }
  function play(freq, dur, type = 'sine', vol = 0.15, detune = 0){
    if (GlobalMute.get()) return;
    init();
    if (!ctx) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    if (detune) o.detune.value = detune;
    const t = ctx.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(sfxGain);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function arp(notes, spacing = 0.06, type = 'triangle', vol = 0.12){
    if (GlobalMute.get()) return;
    notes.forEach((freq, i) => setTimeout(() => play(freq, 0.12, type, vol), i * spacing * 1000));
  }
  const sfx = {
    eat(){ play(720, 0.09, 'triangle', 0.14); setTimeout(() => play(920, 0.09, 'triangle', 0.12), 60); setTimeout(() => play(1150, 0.11, 'triangle', 0.10), 120); },
    turn(){ play(880, 0.03, 'sine', 0.05); },
    die(){ play(420, 0.18, 'sawtooth', 0.12); setTimeout(() => play(320, 0.20, 'sawtooth', 0.12), 130); setTimeout(() => play(220, 0.35, 'sawtooth', 0.12), 280); setTimeout(() => play(140, 0.6, 'sine', 0.10), 460); },
    win(){ arp([523, 659, 784, 1046, 1318], 70, 'triangle', 0.13); },
    timeUp(){ arp([784, 659, 523, 440], 100, 'triangle', 0.12); },
    buy(){ arp([659, 784, 988, 1318], 55, 'triangle', 0.14); play(1568, 0.3, 'sine', 0.08, 0); },
    equip(){ play(660, 0.08, 'triangle', 0.10); setTimeout(() => play(990, 0.12, 'triangle', 0.10), 50); },
    deny(){ play(200, 0.1, 'square', 0.08); setTimeout(() => play(150, 0.15, 'square', 0.08), 90); },
    click(){ play(1200, 0.02, 'sine', 0.06); },
    hover(){ play(1400, 0.02, 'sine', 0.03); },
    start(){ arp([523, 784, 1046], 80, 'triangle', 0.12); },
    pause(){ play(660, 0.06, 'sine', 0.08); setTimeout(() => play(440, 0.1, 'sine', 0.08), 50); },
    unpause(){ play(440, 0.06, 'sine', 0.08); setTimeout(() => play(660, 0.1, 'sine', 0.08), 50); },
    caseSpin(){ [440, 460, 480, 500, 520, 540, 560, 580].forEach((f, i) => setTimeout(() => play(f, 0.03, 'square', 0.05), i * 550)); },
    caseReveal(rarity){
      if (rarity === 'legendary') { arp([523, 659, 784, 1046, 1318, 1568], 60, 'triangle', 0.15); setTimeout(() => arp([2093], 60, 'sine', 0.1), 400); }
      else if (rarity === 'epic') { arp([440, 554, 659, 880], 70, 'triangle', 0.13); }
      else if (rarity === 'rare') { arp([392, 523, 659], 80, 'triangle', 0.11); }
      else { play(440, 0.15, 'triangle', 0.1); setTimeout(() => play(523, 0.15, 'triangle', 0.1), 100); }
    },
    buffPickup(){ play(880, 0.1, 'triangle', 0.13); setTimeout(() => play(1174, 0.1, 'triangle', 0.13), 60); setTimeout(() => play(1568, 0.15, 'triangle', 0.12), 120); setTimeout(() => play(2093, 0.2, 'sine', 0.08), 200); },
    buffExpire(){ play(660, 0.1, 'sine', 0.08); setTimeout(() => play(440, 0.15, 'sine', 0.06), 80); setTimeout(() => play(330, 0.2, 'sine', 0.05), 160); },
    buffWarning(){ play(880, 0.05, 'square', 0.05); },
    comboUp(level){ const base = 600 + level * 80; play(base, 0.06, 'triangle', 0.10); setTimeout(() => play(base * 1.25, 0.08, 'triangle', 0.10), 50); },
    comboBreak(){ play(300, 0.1, 'sawtooth', 0.06); setTimeout(() => play(200, 0.12, 'sawtooth', 0.06), 70); },
    demonRoar(){ play(120, 0.4, 'sawtooth', 0.1); setTimeout(() => play(90, 0.5, 'sawtooth', 0.1), 200); setTimeout(() => play(60, 0.7, 'sine', 0.08), 450); },
  };
  return { play, arp, sfx, resume };
})();

/* ============================================================
   RADIO
============================================================ */
const Radio = (() => {
  const STORAGE_INDEX  = 'snake_v23_radio_index';
  const STORAGE_VOLUME = 'snake_v23_radio_volume';
  const MUSIC_FOLDER   = 'music';
  const MANIFEST_PATH  = 'music/manifest.json';
  let playlist = [];
  let currentIndex = -1;
  let playing = false;
  let audioEl = null;
  let volume = 0.6;

  async function loadFolderPlaylist(){
    try {
      const resp = await fetch(MANIFEST_PATH);
      if (!resp.ok) throw new Error('no manifest');
      const data = await resp.json();
      let items = [];
      if (Array.isArray(data)) items = data.map(f => ({ file: f }));
      else if (data && Array.isArray(data.tracks)) items = data.tracks;
      const loaded = [];
      for (const item of items) {
        if (!item.file) continue;
        const url = `${MUSIC_FOLDER}/${encodeURIComponent(item.file)}`;
        let exists = true;
        try { const head = await fetch(url, { method: 'HEAD' }); exists = head.ok; } catch(e) { exists = false; }
        if (!exists) continue;
        loaded.push({ id: 'folder_' + item.file, name: item.name || item.file.replace(/\.[^.]+$/, ''), artist: item.artist || 'Из папки music/', url, kind: 'folder', icon: '📁' });
      }
      return loaded;
    } catch(e) { return []; }
  }

  function addFiles(files){
    const added = [];
    for (const f of files) {
      if (!f.type.startsWith('audio/') && !/\.(mp3|wav|ogg|m4a|flac|aac|opus|webm)$/i.test(f.name)) continue;
      const url = URL.createObjectURL(f);
      const track = { id: 'file_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8), name: f.name.replace(/\.[^.]+$/, ''), artist: 'Локальный файл', url, kind: 'user', icon: '🎵' };
      playlist.push(track);
      added.push(track);
    }
    return added;
  }

  async function init(){
    try { const v = localStorage.getItem(STORAGE_VOLUME); if (v) volume = Math.max(0, Math.min(1, parseFloat(v))); } catch(e){}
    const folderTracks = await loadFolderPlaylist();
    playlist = folderTracks;
    try { const idx = parseInt(localStorage.getItem(STORAGE_INDEX) ?? '-1', 10); if (idx >= 0 && idx < playlist.length) currentIndex = idx; } catch(e){}
    return folderTracks.length;
  }

  function saveIndex(){ try { localStorage.setItem(STORAGE_INDEX, String(currentIndex)); } catch(e){} }
  function saveVolume(){ try { localStorage.setItem(STORAGE_VOLUME, String(volume)); } catch(e){} }
  function getPlaylist(){ return playlist; }
  function getCurrentIndex(){ return currentIndex; }
  function getCurrentTrack(){ return currentIndex >= 0 ? playlist[currentIndex] : null; }
  function isPlaying(){ return playing; }
  function getVolume(){ return volume; }
  function stopAudioElement(){ if (audioEl) { try { audioEl.pause(); } catch(e){} audioEl.removeAttribute('src'); audioEl.load(); audioEl = null; } }
  function startAudioElement(track){
    stopAudioElement();
    audioEl = new Audio(track.url);
    audioEl.volume = GlobalMute.get() ? 0 : volume;
    audioEl.loop = false;
    audioEl.crossOrigin = 'anonymous';
    audioEl.addEventListener('ended', () => next());
    audioEl.addEventListener('timeupdate', () => updateProgressUI());
    audioEl.addEventListener('loadedmetadata', () => updateProgressUI());
    audioEl.play().catch(e => { console.warn('Не удалось запустить трек', e); });
  }
  function play(index){
    if (index !== undefined && index !== null) { if (index < 0 || index >= playlist.length) return; currentIndex = index; }
    if (currentIndex < 0 && playlist.length > 0) currentIndex = 0;
    const track = getCurrentTrack();
    if (!track) return;
    stopAudioElement(); playing = true; SFX.resume(); startAudioElement(track); saveIndex();
  }
  function pause(){ if (!playing) return; playing = false; if (audioEl) { try { audioEl.pause(); } catch(e){} } }
  function stop(){ playing = false; stopAudioElement(); }
  function toggle(){ if (playing) pause(); else play(); }
  function next(){ if (playlist.length === 0) return; let idx = currentIndex + 1; if (idx >= playlist.length) idx = 0; play(idx); }
  function prev(){ if (playlist.length === 0) return; let idx = currentIndex - 1; if (idx < 0) idx = playlist.length - 1; play(idx); }
  function remove(index){
    if (index < 0 || index >= playlist.length) return;
    const track = playlist[index];
    if (track.kind === 'folder') return;
    if (track.kind === 'user' && track.url) URL.revokeObjectURL(track.url);
    const wasCurrent = index === currentIndex;
    playlist.splice(index, 1);
    if (playlist.length === 0) { currentIndex = -1; stop(); }
    else if (wasCurrent) { currentIndex = Math.min(index, playlist.length - 1); if (playing) play(currentIndex); }
    else if (index < currentIndex) { currentIndex--; }
    saveIndex();
  }
  function setVolume(v){ volume = Math.max(0, Math.min(1, v)); if (audioEl) audioEl.volume = GlobalMute.get() ? 0 : volume; saveVolume(); }
  function getProgress(){ if (audioEl && audioEl.duration) return { current: audioEl.currentTime || 0, total: audioEl.duration || 0, percent: (audioEl.currentTime / audioEl.duration) * 100 }; return { current: 0, total: 0, percent: 0 }; }
  function seek(percent){ if (audioEl && audioEl.duration) audioEl.currentTime = Math.max(0, Math.min(1, percent)) * audioEl.duration; }

  GlobalMute.onChange((muted) => { if (audioEl) audioEl.volume = muted ? 0 : volume; });

  return { init, saveIndex, saveVolume, getPlaylist, getCurrentIndex, getCurrentTrack, isPlaying, getVolume, play, pause, stop, toggle, next, prev, addFiles, remove, setVolume, getProgress, seek };

function detectDevice(){
  const ua = navigator.userAgent;
  const w = window.innerWidth, h = window.innerHeight;
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const isIPad = /iPad/.test(ua) || (ua.includes('Mac') && 'ontouchend' in document);
  let device = 'desktop';
  if (isIPad) device = 'tablet';
  else if (/Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua)) { device = (Math.min(w, h) >= 600) ? 'tablet' : 'phone'; }
  else if (isTouch && Math.min(w, h) >= 600) device = 'tablet';
  if (w < 520 && !isIPad) device = 'phone';

  // В Telegram WebApp почти всегда мобилка — принудительно phone для узких экранов
  const tg = window.Telegram?.WebApp;
  if (tg && tg.platform && tg.platform !== 'unknown' && w < 600) device = 'phone';

  const wasPhone = document.body.classList.contains('device-phone');
  document.body.classList.remove('device-phone', 'device-tablet', 'device-desktop');
  document.body.classList.add('device-' + device);
  document.body.dataset.device = device;
  if (wasPhone && device !== 'phone') closeMobileShop();
}
detectDevice();
let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(detectDevice, 200);
});

const BUFFS = {};

let lastBuffType = null;
let sameTypeStreak = 0;

function pickRandomBuffType(){
  let pool = BUFFS_LIST;
  if (lastBuffType && sameTypeStreak >= 1) {
    pool = BUFFS_LIST.filter(b => b.id !== lastBuffType);
    if (pool.length === 0) pool = BUFFS_LIST;
  }
  const picked = pool[Math.floor(Math.random() * pool.length)];
  if (picked.id === lastBuffType) { sameTypeStreak++; }
  else { sameTypeStreak = 1; lastBuffType = picked.id; }
  return picked.id;
}

let activeBuffs = {};
function isBuffActive(id){ return id in activeBuffs; }

function activateBuff(id){
  const cfg = BUFFS[id];
  if (!cfg) return;
  const isNew = !isBuffActive(id);
  activeBuffs[id] = { timeLeft: cfg.duration, total: cfg.duration };
  state.buffsPicked++;
  if (isNew) {
    SFX.sfx.buffPickup();
    TelegramApp.hapticImpact('medium');
    showToast(`${cfg.icon} ${cfg.name}! ${cfg.desc}`, 'buff', 2400);
    spawnBuffEffect(id);
    if (id === 'multifruit') { for (let i = 0; i < 3; i++) spawnExtraFood(); }
  }
  updateBuffsBar();
}

function updateBuffs(dt){
  for (const id in activeBuffs) {
    const b = activeBuffs[id];
    b.timeLeft -= dt;
    if (b.timeLeft <= 2 && b.timeLeft > 0) {
      if (!b._warned || Date.now() - b._warned > 500) { SFX.sfx.buffWarning(); b._warned = Date.now(); }
    }
    if (b.timeLeft <= 0) {
      delete activeBuffs[id];
      SFX.sfx.buffExpire();
      if (id === 'multifruit') extraFoods = [];
      updateBuffsBar();
    }
  }
}

function updateBuffsBar(){
  const ids = Object.keys(activeBuffs);
  if (ids.length === 0) {
    buffsBar.classList.add('empty');
    buffsBar.innerHTML = '';
    return;
  }
  buffsBar.classList.remove('empty');
  buffsBar.innerHTML = '';
  ids.forEach(id => {
    const cfg = BUFFS[id];
    const b = activeBuffs[id];
    const chip = document.createElement('div');
    chip.className = 'buff-chip ' + id + (b.timeLeft <= 2 ? ' ending' : '');
    chip.innerHTML = `
      <div class="buff-icon">${cfg.icon}</div>
      <div class="buff-info">
        <div class="buff-name">${cfg.name}</div>
        <div class="buff-time">${b.timeLeft.toFixed(1)}с</div>
      </div>
      <div class="buff-progress" style="width:${(b.timeLeft / b.total) * 100}%"></div>
    `;
    buffsBar.appendChild(chip);
  });
}

function tickBuffsBarUI(){
  const chips = buffsBar.children;
  const ids = Object.keys(activeBuffs);
  if (chips.length !== ids.length) { updateBuffsBar(); return; }
  ids.forEach((id, i) => {
    const b = activeBuffs[id];
    const chip = chips[i];
    if (!chip) return;
    const timeEl = chip.querySelector('.buff-time');
    const progEl = chip.querySelector('.buff-progress');
    if (timeEl) timeEl.textContent = b.timeLeft.toFixed(1) + 'с';
    if (progEl) progEl.style.width = Math.max(0, (b.timeLeft / b.total) * 100) + '%';
    if (b.timeLeft <= 2 && !chip.classList.contains('ending')) chip.classList.add('ending');
    if (b.timeLeft > 2 && chip.classList.contains('ending')) chip.classList.remove('ending');
  });
}

}

      combo.value = 1;

      combo.timer = 0;

}

function buildRarityRows(){
  const groups = { common: [], uncommon: [], rare: [], epic: [], legendary: [] };
  SKINS.forEach(s => { if (groups[s.rarity]) groups[s.rarity].push(s); });
  return ['common','uncommon','rare','epic','legendary'].map(rarity => {
    const all = groups[rarity];
    const owned = all.filter(s => state.owned.includes(s.id)).length;
    const total = all.length;
    const done = owned === total;
    return `
      <div class="rarity-row ${rarity}">
        <div class="rarity-dot"></div>
        <div class="label">${RARITIES[rarity].name}</div>
        <div class="count ${done ? 'done' : ''}">${owned}/${total}${done ? ' ✓' : ''}</div>
      </div>
    `;
  }).join('');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function attachProfileHandlers(root){
  root.querySelectorAll('[data-action]').forEach(el => {
    const action = el.dataset.action;
    if (action === 'avatar') {
      el.addEventListener('click', () => {
        const idx = AVATAR_OPTIONS.indexOf(profile.avatar);
        profile.avatar = AVATAR_OPTIONS[(idx + 1) % AVATAR_OPTIONS.length];
        saveProfile(); renderProfile(); SFX.sfx.equip();
        TelegramApp.hapticImpact('light');
      });
    } else if (action === 'name') {
      el.addEventListener('click', () => {
        const newName = prompt('Введите новое имя (до 20 символов):', profile.name);
        if (newName === null) return;
        const trimmed = newName.trim().slice(0, 20);
        if (trimmed) {
          profile.name = trimmed;
          saveProfile(); renderProfile();
          showToast(`Имя изменено: ${profile.name}`, 'success', 1500);
        }
      });
    } else if (action === 'reset') {
      el.addEventListener('click', () => {
        const ok = confirm('Ты уверен? Весь прогресс (скины, яблоки, рекорды) будет удалён.');
        if (!ok) return;
        state = { apples: 50, owned: ['gummy'], active: 'gummy', bestScore: 0, totalApples: 0, gamesPlayed: 0, casesOpened: 0, buffsPicked: 0, bestByMode: { classic: 0, hardcore: 0, endless: 0 }, version: '2.7' };
        save(); renderCases(); renderCollection(); renderProfile(); renderModes(); updateHUD();
        showToast('Прогресс сброшен', 'info', 1800);
        SFX.sfx.deny();
      });
    }
  });
}
